        - {where: support arm fillet, stress_MPa: 1048, stress_ksi: 152, temperature_C: 649, temperature_F: 1200}
        - {where: web outer, stress_MPa: 503, stress_ksi: 73, temperature_C: 603, temperature_F: 1117}
        - {where: web at arm, stress_MPa: 531, stress_ksi: 77, temperature_C: 594, temperature_F: 1102}
