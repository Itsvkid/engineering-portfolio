# E3 HPT — mechanical design, as printed.
# Source: NASA CR-167955 section 5, pp.86 onward (PDF page = report page
# + 8). Companion to hpt-cooling.yaml (sec 3) and hpt-clearance.yaml
# (sec 4). Every value carries its source; nothing is corrected.

meta:
  source: e3-hp-turbine-hardware-CR-167955.pdf
  pages_read: "86-130"
  transcribed: 2026-09-05
  status: sec 5.1 complete; sec 5.2.1 rotor structure complete (Figs.57-72); stage-1 blade in progress (Figs.73-75, Tables XIX-XX done; Figs.76-78 and stage 2 to follow)

configuration:
  src: "sec 5.1.1 p.86; Fig.50 p.87"
  stages: 2
  features:
    inducer_system: lower-temperature air for blade cooling (expander; low-expansion Inco 903A stationary seal)
    impeller: raises stage-1 coolant pressure for backflow margin against the hot gas
    inner_tube: separates fan air (under the tube) from the stage-2 CDP coolant
    deswirler: rotating vanes integral with the inducer disk, against acoustic vibration and vortex whistle
    boltless_blade_retainers: no bolts through the disk rim, for disk LCF
    no_bolts_in_disks: no holes in the main structural portions of the disks
    interstage_seal_disk: stops hot-gas recirculation between the stage-1 and stage-2 blades at the inner flowpath
    single_wall_structure: fan air impinges directly on the casing for the ACC; no holes through the casing wall
    stage1_ceramic_shrouds: less cooling air than metal shrouds; the saving goes to efficiency
    stage2_solid_shrouds: for life

design_lives:
  src: "Table XV p.88 — component design lives, growth cycle"
  columns: [service_flight_hours, service_flight_cycles, total_with_repair_hours, total_with_repair_cycles]
  flowpath_components_and_blade_retainers: [9000, 9000, 18000, 18000]
  disks_shafts_seal_disk: [18000, 18000, 36000, 36000]
  note: flowpath parts (blades, vanes, retainers, interstage disk) are designed for 18,000 h with repair permitted after the first 9,000; disks and shafts for 36,000 with one repair at 18,000. One cycle per flight hour -- the HPT report's cycle is one hour where the LPT's is two.
  repairs:
    src: "pp.88-89"
    blades: {tip: weld build-up locally or Activated Diffusion Bonding tip replacement (TF39-developed), platform_cracks: Activated Diffusion Healing for cracks under 0.1016 cm (0.04 in) with no missing material, coating: strip and re-apply the PVD coating}
    blade_retainers: weld repair limited to the labyrinth seal teeth; Rene 95 filler; alumina coating stripped first, re-applied after X-ray and Zyglo; established for Inco 718, not yet for AF115
    rabbets: machine 0.0254-0.0508 cm (0.01-0.02 in), hard-metal spray, grind to size
    disks: flange boltholes reamed and polished; rabbet wear; radial scallops in the flanges (air passages); stage-2 forward disk arm cooling holes
    shafts: two seal teeth on the HP shaft repaired as on the CF6-50 interstage catenary support; flange cracks reamed if small
    impeller: elliptical cooling passages above the rabbet support may be opened slightly
    forward_seal_disk: cooling holes, elliptical boltholes and inner-flange boltholes may be opened slightly

materials:
  src: "sec 5.1.2 pp.90-96; Fig.51 p.91 (rotor); Fig.52 p.92 (static); Table XVI p.93"
  icls_vs_fps_difference: HP shaft and aft shaft/disk -- ICLS Inco 718, FPS "Super" Inco 718 (ASTM grain 7 or finer) to reach the 36,000-cycle LCF goal; Super Inco 718 is in CF6-50 HPT disks
  disks_and_forward_outer_liner: Rene 95, powder metallurgy, hot isostatically pressed near net shape; creep and fatigue to about 650 C (1200 F)
  inducer_disk_interstage_seal_disk_impeller_u_clip_stage1_retainer: AF115, PM; strength and fatigue like Rene 95 to 650 C, creep better -- 50 C (90 F) hotter for the same creep life; first application of AF115
  blades: directionally solidified Rene 150 (GE, for DS), grain boundaries parallel to the tensile load; metal temperature about 1100 C (2000 F); PVD nickel-base oxidation coating
  supplementary_tests: LCF and creep/rupture on Rene 95 and AF115 at the components' design-point conditions

  rotor_parts:
    src: "Fig.51 p.91"
    stage1_blade: Rene 150
    stage2_blade: Rene 150
    disk1: Rene 95
    disk2: Rene 95
    interstage_seal_disk: AF115
    impeller: AF115
    inducer_seal_disk: AF115
    boltless_retainer: AF115
    outer_liner: Rene 95
    hpt_shaft: Inco 718
    aft_shaft_and_disk: Inco 718
    as_printed: "both disks are labelled 'Disk 1' in the figure"
  static_parts:
    src: "Fig.52 p.92"
    forward_casing: Inco 718
    aft_casing: Inco 718
    acc_manifold: 321 stainless steel
    stage1_shroud_support: Inco 718
    nozzle_axial_support: Rene 41
    stage1_nozzle: {bands: MAR-M-509, airfoils: MA754}
    stage1_shrouds: ceramic (yttria-stabilised zirconia on a cast Rene 77 backing, thermal-sprayed, mechanically anchored)
    stage2_nozzle: {bands: Rene 80, airfoils: DS Rene 150}
    stage2_shroud: solid Rene 77 with a cobalt-base thermal-sprayed coating (F101 / CF6-80 type)
    stage2_outer_seal_spoolie_support: Inco 718
    interstage_seals: Hastelloy X
    inducer_and_cdp_seal: Rene 41 welded to Inco 903A
    inner_nozzle_support: Rene 41
