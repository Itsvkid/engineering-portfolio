stator:
  src: "sec 5.2.2 pp.150-154; Fig.92 p.153"
  primary_structure: forward and aft outer nozzle supports (the forward and aft HPT cases) -- the engine's structural link through the HPT, carrying the cycle pressures, thrust and mechanical loads
  parts: [outer casing, impingement manifolds and fan-air ducts, stage-1 ceramic shrouds, stage-2 solid shrouds, stage-2 nozzle, inner nozzle support structure, nozzle inner seal, discourager seal, interstage seal, inducer and CDP seal]
  stage2_nozzle_mount: directly on internal casing flanges
  stage1_nozzle_outer_axial_support: conical, carrying the nozzle's outer axial load to the casing inner flange
  stage1_shroud_forward_support_ring: saw-cut (slotted from the inner edge) for thermal stress and shroud growth; faced fore and aft by trapped 360-degree seal plates free to grow radially; hollow rivets between the plates meter the compressor-discharge air that cools the stage-1 shrouds
  casing_stress: predominantly thermal; extremes at the takeoff transient and with the ACC on at max climb and max cruise (Fig.93)
  casings:
    src: "sec 5.2.2.1 p.154"
    fps_material: Direct Age Inco 718 (DA718)
    why: LCF up to 10 times standard Inco 718, varying with temperature and stress; enough for more than 50,000 cycles at every potentially limiting location against the 36,000 goal
    status: new material under process and component evaluation
    stage1_nozzle_outer_axial_support: standard Inco 718, adequate LCF
    shroud_support: Rene 41 -- 111 C (200 F) more margin than Inco 718 to the knee of its strength curve
  stage1_nozzle_support:
    src: "sec 5.2.2.2 p.154; Fig.94"
    material: forged Rene 41, welded and machined; FPS base with Rene 41 forged end flanges and Rene 41 sheet elsewhere for cost
    loads: airfoil gas loads and the inner seal; the nozzle segments bolt to the aft flange; discourager and inner seal mounts hang from it
    ogv_joint: {bolts: 64, diameter_cm: 0.953, diameter_in: 0.375, to: compressor OGV flange}
    analysis: differential pressure across the wall, vane gas loads, outer axial-support loads; LCF at 40 s into hot-day takeoff meets 36,000 cycles
  casing_lcf_map:
    src: "Fig.93 p.155 — casing LCF life, stress and temperature at hot-day maximum takeoff; every location > 1e5 cycles"
    points:
      - {where: forward flange outer, hoop_MPa: 455, hoop_ksi: 66, radial_MPa: 462, radial_ksi: 67, C: 366, F: 691, kt: 2}
      - {where: forward ring, hoop_MPa: 338, hoop_ksi: 49, radial_MPa: 372, radial_ksi: 54, C: 366, F: 691, kt: 2}
      - {where: mid flange outer, hoop_MPa: 393, hoop_ksi: 57, radial_MPa: 400, radial_ksi: 58, C: 323, F: 613, kt: 2}
      - {where: mid flange, hoop_MPa: 386, hoop_ksi: 56, radial_MPa: 393, radial_ksi: 57, C: 327, F: 620, kt: 2}
      - {where: aft flange, hoop_MPa: 228, hoop_ksi: 33, radial_MPa: 241, radial_ksi: 35, C: 323, F: 613, kt: 2}
      - {where: aft cone, hoop_MPa: 131, hoop_ksi: 19, radial_MPa: 138, radial_ksi: 20, C: 370, F: 699, kt: 3}
      - {where: stage-2 nozzle hook, hoop_MPa: 152, hoop_ksi: 22, radial_MPa: 152, radial_ksi: 22, C: 376, F: 709, kt: 3}
      - {where: stage-2 shroud support, hoop_MPa: -234, hoop_ksi: -34, radial_MPa: 234, radial_ksi: 34, C: 547, F: 1017, kt: 2}
      - {where: stage-1 shroud support inner, hoop_MPa: -255, hoop_ksi: -37, radial_MPa: 283, radial_ksi: 41, bending_MPa: -124, bending_ksi: -18, C: 626, F: 1159}
      - {where: stage-1 nozzle axial support, hoop_MPa: -221, hoop_ksi: -32, radial_MPa: 228, radial_ksi: 33, C: 603, F: 1117, kt: 2}
      - {where: stage-1 shroud support ring, hoop_MPa: -234, hoop_ksi: -34, radial_MPa: 421, radial_ksi: 61, bending_MPa: -379, bending_ksi: -55, C: 613, F: 1136}
