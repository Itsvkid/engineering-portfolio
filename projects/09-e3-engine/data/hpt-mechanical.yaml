  speeds_note: "Fig.84 runs the rupture at 13,414 rpm (FPS base hot-day takeoff); both dovetail figures at 13,948 (growth). 13,948 / 13,414 = 1.040."

rotor_dynamics:
  src: "sec 5.2.1.11 pp.144-148; Table XXII p.147; Fig.88 p.148"
  method: CLASS/MASS free-vibration frequencies and mode shapes for N circumferential nodal diameters in the fundamental axial mode at zero speed, then corrected with speed into forward- and backward-travelling waves; the backward wave falls with speed and its zero is the critical speed, excitable by any static load with N nodes
  safety_margin_definition: (critical engine speed - maximum engine speed) / maximum engine speed
  max_engine_speed_rps: 233
  max_engine_speed_note: growth; 233 rps is 13,980 rpm against the 13,948 of the dovetail figures
  table_xxii:
    component:          [forward_shaft, inner_tube, outer_liner, aft_seal_disk]
    critical_nodes_N:   [4, 3, 7, 5]
    critical_speed_rps: [820, 610, 1030, 610]
    safety_margin:      [2.52, 1.62, 3.42, 1.61]
    as_printed: "inner tube and aft seal disk share the 610-rps critical yet print 1.62 and 1.61; (610 - 233)/233 is 1.618. Recorded."
  aft_seal_disk:
    src: "Fig.88"
    N: 5
    zero_speed_frequency_cps: 2500
    backward_wave_zero_rps: 610
    forward_wave_at_440_rps_cps: 3350
    idle_rps: 170
    concern: web flexibility between the bolt circle and the seal teeth lets the disk move axially and pump the adjoining air cavities -- an aerodynamic instability path; a damper was added against axial excitation

rotor_bolts:
  src: "sec 5.2.1.12 pp.147-150; Figs.89-91"
  criteria: [no flange separation under any combined load and temperature, torque through flange friction only with no slip]
  loads: CLASS-MASS rotor analysis at hot-day takeoff; torque from the maximum engine-required torque of the FPS cycle
  life_objective_hours: 9000
  relaxation: creep relaxation of bolt and nut over the mission mix included, so the relaxed load still carries every load
  tool: BOFLAN -- assembly torque converted to a cold clamping load
  flanges:
    src: "Fig.89 p.149 — studs with anti-torque collars, Inco 718"
    flange:      [inducer_disk, interstage, aft_seal_disk, inner_tube]
    count:       [34, 52, 40, 36]
