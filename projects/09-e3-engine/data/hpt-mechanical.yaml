    plastic_zone: at the bore
    note: the bore yields at 40 s on the growth engine -- the plastic zone is drawn -- which is what the elastic/plastic run is for

stage1_blade:
  src: "sec 5.2.1.9 pp.118-130; Figs.73-78; Tables XIX-XX"
  material: cast DS Rene 150, PVD coated
  cooling_features:
    src: "Fig.73 p.125"
    list: [suction and pressure-side film holes, pressure-side trailing-edge bleed, warm-air impingement on the leading edge, serpentine convection cooling, trailing-edge cold bridge, turbulence promoters on ribs and airfoil, impinged pin-fin trailing-edge slot]
  life_objective: {mission_mix_hours: 18000, lcf_cycles: 18000}
  design_mission:
    src: "Table XIX p.126 — design mission cycle, 2 hours"
    segment:       [ground_idle_taxi, takeoff_100pct, max_climb, cruise_90_70pct, descent_flight_idle, loiter_60pct, approach_45pct, reverse_thrust_90pct]
    altitude_km:   ["0-1.83", "0-1.83", "0-10.67", "4.57-12.19", "12.19-1.52", "1.52", null, "1.83-0"]
    altitude_ft:   ["0-6000", "0-6000", "0-35000", "15000-40000", "40000-5000", "5000", null, "6000-0"]
    mach:          ["0-0.1", "0-0.3", "0.38-0.80", "0.60-0.85", "0.85-0.65", "0.5", null, "0.31-0.28"]
    minutes:       [18.0, 2.0, 22.0, 48.0, 17.0, 7.7, 5.0, 0.3]
    percent:       [15.0, 1.7, 18.3, 40.0, 14.2, 6.2, 4.3, 0.3]
    total_minutes: 120
    climb_airspeed_m_s: [128.6, 164.6]
    climb_airspeed_knots: [250, 320]
    note: the same two-hour mission as the LPT report's Fig.51 and the HPT report's own Fig.12; the segment times here sum to exactly 120
    as_printed_inconsistency: "loiter 7.7 min prints 6.2 percent (7.7/120 is 6.4) and approach 5.0 min prints 4.3 (4.2); the other six rows agree and the column still sums to 100.0. Recorded."
  rupture_life:
    src: "sec 5.2.1.9 p.127; Table XX; Fig.74 p.128"
    critical_conditions: [takeoff, maximum climb, maximum cruise]
    method: each condition split by ambient temperature probability (Fig.74); pitch section rupture-limiting at hot day, confirmed by a five-airfoil-section model; BUCKET CREEP III on the pitch section with element-by-element temperatures, gas bending and centrifugal loads
    mission_mix:
      src: "Table XX p.127 — stage-1 HPT blade mission mix summary"
      condition:      [takeoff, max_climb, max_cruise, balance]
      pct_life_used:  [36, 49, 15, 0.1]
      hours_at_point: [300, 3300, 7200, 7200]
      total_hours: 18000
      balance_note: "'<0.1' carried as 0.1"
      equivalent_hours_at_max_takeoff: 250
      available_blade_life_at_max_takeoff_hours: 264
      note: 300 hours at takeoff -- 1.7 percent of the mission -- uses 36 percent of the blade's life
    fig74_ambient_mix:
      takeoff: {hours: 300, bands_pct: [4, 39, 16, 10, 8, 6, 8, 4, 5], ambient_range_C: [-40, 50]}
      max_climb: {hours: 3300, bands_pct: [4, 8, 28, 20, 40], ambient_range_C: [-30, 0]}
      max_cruise: {hours: 7200, bands_pct: [4, 8, 28, 20, 40], ambient_range_C: [-30, 0]}
  tilt_and_vibration:
    src: "p.130; Fig.76"
    five_section_model: change of blade tilt from creep and plasticity over 18,000 h found insignificant -- the cast-in tilt that counteracts the gas moment holds
    life_limiting_location: trailing edge at 25 percent span (mechanical plus vibratory)
    vibratory_mode: first flex
    allowable_vibratory_stress_MPa: 145
    allowable_vibratory_stress_ksi: 21
    allowable_basis: single amplitude, more than adequate for 18,000 h; expected levels well below
  lcf:
    src: "p.130; Figs.77-78"
    method: total local strain over the transient accel and decel (start, idle, accel to max takeoff for 2 minutes, decel to idle), BUCKET CREEP III thermal and mechanical strains, material LCF curve at temperature
    minimum_life_location: leading-edge film hole, pitch section
    transient_reading: slight tension on the starter accel; fuel on at about 22 s; the leading edge heats faster than the section and goes into net compression (thermal compression exceeding centrifugal tension); compression eases from 22 to 300 s as the section catches up
    transient_cycle:
      src: "Fig.77 p.132 — FPS base stages 1 and 2 blade transient cycle; read off"
      phases_s: {start_to_idle: 80, ground_idle_to: 300, accel_to_takeoff: 20, takeoff_to: 500, decel: 10}
      t41_C: {start_peak_at_40_70s: 1000, ground_idle: 780, takeoff: 1350, after_decel: 780}
      core_speed_axis_note: "the speed axis is labelled 0-2000 'rpm' with idle at ~1300 and takeoff at ~1800; read as rpm/10 (Fig.53 has idle 11,700 and takeoff 13,300)"
    leading_edge_stress_history:
      src: "Fig.78 p.133 — pitch section, leading-edge film hole; longitudinal stress, MPa; read off"
      start_dip_MPa: -170
      idle_MPa: -20
      transient_to_takeoff_MPa: -215
      takeoff_MPa: -150
      decel_to_idle_peak_MPa: 200
      total_range_MPa: 414
      total_range_ksi: 60
      lcf_cycles_at_limiting_location: 26000
      basis: Rene 150 strength data at 414 MPa and the leading-edge temperature; leading edge above 1038 C (1900 F) at takeoff; 120 s at takeoff then climb assumed, then a chop to idle that puts the leading edge in tension
    thrust_reverse:
      src: "Fig.79 p.135 — flight idle to thrust reverse to ground idle, 4420-4540 s"
      range_MPa: 118
      range_ksi: 17.1
      text_range_MPa: 117
      text_range_ksi: 17
      lcf_cycles: ">1e6"
      miners_rule: "1/LCF = 1/26000 + 1/1e6"
      lcf_combined_printed: 25381
      note: "1/(1/26000 + 1/1e6) is 25,341; the figure prints 25,381. Recorded."
    campbell:
      src: "Fig.80 p.136 — FPS base stage-1 blade Campbell diagram; read off"
      speeds_rpm: {ground_idle: 9300, flight_idle: 10100, max_cruise: 12300, max_climb: 12700, max_takeoff: 13100}
      modes_kHz:
        first_flex:    {at_0: 2.9, at_14000: 2.5}
        first_axial:   {at_0: 5.0, at_14000: 4.5}
        first_torsion: {at_0: 9.1, at_14000: 8.4}
        two_stripe:    {at_0: 16.0, at_14000: 13.9}
      forcing_per_rev:
        vane_diff: 2
        five_per_rev: 5
        stage1_vane_burners: 16
        stage1_nozzle_segments: 23
        stage2_nozzle_segments: 24
        burners: 30
        stage1_vanes: 46
        stage2_vanes: 48
        lpt_stage1_vanes: 72
      finding: the stage-1 nozzle is the strongest excitation; every primary mode has speed margin near its resonance; resonances are passed through, not run at
      note: 46/23 and 48/24 -- two vanes per nozzle segment on both stages; 30 burners are the 30 fuel nozzles; 72 is the LPT stage-1 vane count of the LPT report's Fig.6
    platform_damper:
      material: Inco 625 sheet strip under the platform, bearing on the adjacent platform
      equivalent_g_load_N: 85.8
      equivalent_g_load_lbf: 19.3
      damping_load_N: 84.5
      damping_load_lbf: 19
      first_flex_vibratory_stress_with_damper_MPa: 21
      first_flex_vibratory_stress_with_damper_ksi: 3
    rupture_vs_span:
      src: "Fig.76 p.131 — five-section rupture life including creep on tilt, hot-day takeoff hours; read off"
      span_pct:   [0, 12.5, 25, 50, 70]
      hours:      [450, 390, 345, 310, 830]
      required_hours: 300
      note: the pitch (50 percent) section is the minimum at ~310 h against the 300-h line
  dovetail:
    src: "sec 5.2.1.9 pp.134-138; Fig.81 p.137"
    form: axial, two-tang; upper tang with a generous fillet for Kt and a deeper tang for the higher load; lower tang with compound fillet radii
    condition: {rating: hot-day takeoff, rpm: 13948, material: Rene 150, properties: 3 sigma}
    load_per_blade_kN: 77.395
    load_per_blade_lbf: 17400
    axial_chord_cm: 3.45
    axial_chord_in: 1.36
    tangs:
      - {tang: upper, combined_stress_with_kt_MPa: 862, ksi: 125.0, neck_width_cm: 0.952, neck_width_in: 0.375}
      - {tang: lower, combined_stress_with_kt_MPa: 746, ksi: 108.2, neck_width_cm: 0.820, neck_width_in: 0.323}
    lcf_cycles: ">18,000"
    method: MULTI HOOK -- centrifugal load and net moments Mx, Mg at the dovetail mesh as boundary conditions; equivalent loads at the four corners of each tang and the centre; stresses at 15-degree intervals round the mesh radius
    calibration: MULTI HOOK reads higher than FINITE and field lives run higher than calculated; CF6-50 stage-1 Rene 150 blades ran 1000 C cycles without dovetail cracks at higher calculated stress than the E3's stage 1; E3 stage 2 is similar to the CF6-50 three-tang design
    open_items: [axial compressive stress in the dovetail judged offset by MULTI HOOK's conservatism, cooling-hole effect on the tangential load path and Kt, a 3-D dovetail model in progress with the cooling slots treated 2-D]

