  stage2_disk:
    src: "sec 5.2.1.7 p.118; Figs.69-71"
    material: Rene 95
    analysis: disk posts by FINITE at maximum hot-day-takeoff blade loads; live disk by CYANIDE with CLASS-MASS boundary loads; 10 concentration locations assessed, 7 shown
    aft_flange_scallops: added to cut the hoop stress concentration
