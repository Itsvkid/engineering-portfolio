# E3 HPT — mechanical design, as printed.
# Source: NASA CR-167955 section 5, pp.86 onward (PDF page = report page
# + 8). Companion to hpt-cooling.yaml (sec 3) and hpt-clearance.yaml
# (sec 4). Every value carries its source; nothing is corrected.

meta:
  source: e3-hp-turbine-hardware-CR-167955.pdf
  pages_read: "86-170"
  transcribed: 2026-09-05
  status: sec 5.1, 5.2.1 and 5.2.2 complete (rotor, blades, dynamics, bolts, casings, both nozzles); sec 5.2.3 ceramic shrouds onward to follow

configuration:
  src: "sec 5.1.1 p.86; Fig.50 p.87"
  stages: 2
  features:
    inducer_system: lower-temperature air for blade cooling (expander; low-expansion Inco 903A stationary seal)
    impeller: raises stage-1 coolant pressure for backflow margin against the hot gas
    inner_tube: separates fan air (under the tube) from the stage-2 CDP coolant
    deswirler: rotating vanes integral with the inducer disk, against acoustic vibration and vortex whistle
    boltless_blade_retainers: no bolts through the disk rim, for disk LCF
    no_bolts_in_disks: no holes in the main structural portions of the disks
    interstage_seal_disk: stops hot-gas recirculation between the stage-1 and stage-2 blades at the inner flowpath
    single_wall_structure: fan air impinges directly on the casing for the ACC; no holes through the casing wall
    stage1_ceramic_shrouds: less cooling air than metal shrouds; the saving goes to efficiency
    stage2_solid_shrouds: for life

design_lives:
  src: "Table XV p.88 — component design lives, growth cycle"
  columns: [service_flight_hours, service_flight_cycles, total_with_repair_hours, total_with_repair_cycles]
  flowpath_components_and_blade_retainers: [9000, 9000, 18000, 18000]
  disks_shafts_seal_disk: [18000, 18000, 36000, 36000]
  note: flowpath parts (blades, vanes, retainers, interstage disk) are designed for 18,000 h with repair permitted after the first 9,000; disks and shafts for 36,000 with one repair at 18,000. One cycle per flight hour -- the HPT report's cycle is one hour where the LPT's is two.
  repairs:
    src: "pp.88-89"
    blades: {tip: weld build-up locally or Activated Diffusion Bonding tip replacement (TF39-developed), platform_cracks: Activated Diffusion Healing for cracks under 0.1016 cm (0.04 in) with no missing material, coating: strip and re-apply the PVD coating}
    blade_retainers: weld repair limited to the labyrinth seal teeth; Rene 95 filler; alumina coating stripped first, re-applied after X-ray and Zyglo; established for Inco 718, not yet for AF115
    rabbets: machine 0.0254-0.0508 cm (0.01-0.02 in), hard-metal spray, grind to size
    disks: flange boltholes reamed and polished; rabbet wear; radial scallops in the flanges (air passages); stage-2 forward disk arm cooling holes
    shafts: two seal teeth on the HP shaft repaired as on the CF6-50 interstage catenary support; flange cracks reamed if small
    impeller: elliptical cooling passages above the rabbet support may be opened slightly
    forward_seal_disk: cooling holes, elliptical boltholes and inner-flange boltholes may be opened slightly

materials:
  src: "sec 5.1.2 pp.90-96; Fig.51 p.91 (rotor); Fig.52 p.92 (static); Table XVI p.93"
  icls_vs_fps_difference: HP shaft and aft shaft/disk -- ICLS Inco 718, FPS "Super" Inco 718 (ASTM grain 7 or finer) to reach the 36,000-cycle LCF goal; Super Inco 718 is in CF6-50 HPT disks
  disks_and_forward_outer_liner: Rene 95, powder metallurgy, hot isostatically pressed near net shape; creep and fatigue to about 650 C (1200 F)
  inducer_disk_interstage_seal_disk_impeller_u_clip_stage1_retainer: AF115, PM; strength and fatigue like Rene 95 to 650 C, creep better -- 50 C (90 F) hotter for the same creep life; first application of AF115
  blades: directionally solidified Rene 150 (GE, for DS), grain boundaries parallel to the tensile load; metal temperature about 1100 C (2000 F); PVD nickel-base oxidation coating
  supplementary_tests: LCF and creep/rupture on Rene 95 and AF115 at the components' design-point conditions

  rotor_parts:
    src: "Fig.51 p.91"
    stage1_blade: Rene 150
    stage2_blade: Rene 150
    disk1: Rene 95
    disk2: Rene 95
    interstage_seal_disk: AF115
    impeller: AF115
    inducer_seal_disk: AF115
    boltless_retainer: AF115
    outer_liner: Rene 95
    hpt_shaft: Inco 718
    aft_shaft_and_disk: Inco 718
    as_printed: "both disks are labelled 'Disk 1' in the figure"
  static_parts:
    src: "Fig.52 p.92"
    forward_casing: Inco 718
    aft_casing: Inco 718
    acc_manifold: 321 stainless steel
    stage1_shroud_support: Inco 718
    nozzle_axial_support: Rene 41
    stage1_nozzle: {bands: MAR-M-509, airfoils: MA754}
    stage1_shrouds: ceramic (yttria-stabilised zirconia on a cast Rene 77 backing, thermal-sprayed, mechanically anchored)
    stage2_nozzle: {bands: Rene 80, airfoils: DS Rene 150}
    stage2_shroud: solid Rene 77 with a cobalt-base thermal-sprayed coating (F101 / CF6-80 type)
    stage2_outer_seal_spoolie_support: Inco 718
    interstage_seals: Hastelloy X
    inducer_and_cdp_seal: Rene 41 welded to Inco 903A
    inner_nozzle_support: Rene 41
    inner_seal: Rene 41 welded to Inco 903A
  table_xvi:
    src: "Table XVI p.93 — rotor and stator materials; form E extrusion, C cast, DS directionally solidified, PM powder metallurgy, F forging, HC hard coat, S sheet"
    rows:
      - [stage1_vanes, MA754, E, "creep, burnout margin, LCF"]
      - [stage1_bands, MAR-M-509, C, "rupture, cost, yield strength"]
      - [stage1_and_2_blades, Rene 150, "C, DS", "rupture, LCF"]
      - [stage1_and_2_disks, Rene 95, PM, "tensile (burst)"]
      - [stage1_shrouds, ceramic zirconia/yttria, "--", "high temperature > 1370 C (2500 F) capability, erosion"]
      - [stage2_shrouds, Rene 77 solid, C, cost]
      - [stage2_nozzle_and_shroud_support, Inco 718, F, "medium-temperature strength, tensile strength"]
      - [outer_casing, Inco 718, F, "medium-temperature strength, tensile strength"]
      - [stage1_retainer_seal_fwd_and_aft, AF115, PM, "704-760 C (1300-1400 F) creep, LCF"]
      - [interstage_seal_disk_and_spacer_retainer, AF115, PM, "704-760 C (1300-1400 F) creep, LCF"]
      - [stage1_inner_nozzle_support, Rene 41, F, "rupture vs Inco 718, temperature"]
      - [stage2_vane, Rene 150, C, "LCF, rupture"]
      - [stage2_vane_band, Rene 80, C, "rupture and castability"]
      - [stage2_innerstage_seal, Hastelloy X, "F, HC", temperature]
      - [impeller, AF115, PM, "temperature, LCF, rupture"]
      - [inner_shield, Inco 718, F, "538-649 C (1000-1200 F) tensile"]
      - [stage2_aft_retainer, AF115, PM, "creep, rupture strength"]
      - [forward_shaft, Inco 718, F, "538-649 C (1000-1200 F) tensile, LCF"]
      - [fwd_outer_liner, Rene 95, F, "LCF, rupture"]
      - [inducer_seal_disk, AF115, "F, S", "rupture, LCF, temperature"]
      - [aft_shaft_disk, Inco 718, F, "538-649 C (1000-1200 F) tensile, LCF"]
      - [inducer_cdp_seal, Inco 903A / Rene 41, "F/S HC", "low coefficient of expansion for clearance matching"]
      - [stage1_inner_seal, Rene 41 / Inconel 903A, "F/H/C", "temperature, LCF, coefficient of expansion"]
    note: Table XVI lists the disks as Rene 95 forgings in one row and PM in another reading; the text (p.90) says PM, HIP near net shape. The fwd outer liner is 'F' here and Rene 95 PM in the text. Recorded.
  blade_coating:
    src: "pp.90-94"
    icls: single-layer nickel-base PVD coating
    fps: two-component -- nickel-base PVD (different composition) then pack aluminide; slightly better oxidation resistance, two operations
    pvd_process: part and feed ingot in a low-pressure chamber; electron beam evaporates the ingot; the part is manipulated above it to expose all specified surfaces
    cf6_50_evidence:
      engine: CF6-50 455-508 build 21, 1000 C cycles
      blades: stage-1 HPT, Rene 150, PVD, with cooling flow cut from 3.4 to 2.8 percent (centre LE row and pressure-side midchord holes deleted)
      predicted_le_temperature_C: 1110
      predicted_le_temperature_F: 2030
      result: appearance after 1000 cycles like standard Rene 80 Codep blades despite running 56 C (100 F) hotter
      e3_stage1_max_surface_temperature_C: 1074
      e3_stage1_max_surface_temperature_F: 1965
      margin_below_cf6_test_C: 36
      margin_below_cf6_test_F: 65
      conclusion: 9,000 h between coating repairs attainable
  stage1_nozzle_materials:
    src: "pp.94-95"
    vanes: MA-754, oxide-dispersion-strengthened, mechanically alloyed; strongly textured, properties orientation-dependent; textured spanwise for thermal fatigue; usable above 1100 C (2000 F) uncoated
    bands: MAR-M-509 cobalt-base casting; distortion-resistant to about 1040 C (1900 F)
    joint: brazed airfoil-to-band, the same braze alloy as GE's other stage-1 nozzles; service cracks on such nozzles start at the trailing-edge inner-vane pressure side, cross the braze and run along the band; nozzle retired only on inner-band flange yielding or flange cracks
  fracture_mechanics:
    src: "pp.95-96"
    issue: as-HIP Rene 95 PM can fall short of the -3 sigma LCF prediction because process defects initiate cracks even in virgin material
    action: fracture-mechanics analysis of the HPT spool on an assumed defect at the NDT detection limit, in progress; process or material changes possible for the FPS spool; Rene 95 and AF115 stay, with cleaner-powder processing underway

analytical_methods:
  src: "sec 5.1.3 pp.96-98; Table XVII"
  programs:
    BUCKET_CREEP: time-dependent local stress, strain and creep damage; beam theory, plane sections
    CLASS_MASS: axisymmetric-shell stress and vibration (thermal, mechanical, manoeuvre); orthotropic shells; centrifugal recovery; mode shapes and harmonics; axisymmetric or harmonic loads
    TWISTED_BLADE: natural frequencies, relative vibratory stress, steady stresses (centrifugal, axial and tangential bending, shear, untwist-induced spanwise)
    MULTI_HOOK: modified Heywood dovetail stresses (radial P/A, tang bending MC/I, tang hook); vibratory stress at corner and midchord; notch, neck and bending concentrations
    CYANIDE: elasto-plastic finite elements (constant strain, plane stress/strain, axisymmetric ring); speed and thermal loads; creep and large displacement; nonlinear stress-strain; plastic zone; contour post-processing
    FINITE: elastic finite elements (constant-strain quadrilaterals); plane stress/strain, axisymmetric; speed and thermal loads; orthotropic properties
    BOLFAN: cold bolt preload and assembly torque from hot loads and flange torque transmission; no-separation, no-slip criteria; axisymmetric; bolt and flange creep relaxation over the mission mix; rupture damage vs time
  procedure: CLASS-MASS on the rotor as shells (cylindrical shafts, conical stub shaft, vertical disks) gives loads and deflections; FINITE takes them as boundary conditions for local stresses at holes, posts, slots, fillets and bores, where the radial and circumferential gradients from speed and temperature make photoelastic reference data inadequate
  note: the LPT report's Figs.75, 79 and 86 name CLASS/MASS too, and its Table XIII bolt analysis is what BOLFAN does -- one GE toolset across both turbines

rotor_analysis_conditions:
  src: "sec 5.1.3.2 p.99; Table XVIII; Fig.53 p.100"
  basis: hot day, 50 C (121 F) takeoff, E3 FPS growth cycle
  flight_times_s:
    ground_idle: 500
    transient_takeoff_from_idle: [10, 30, 40, 60, 125]
    end_of_max_cruise_from_ground_idle: 875
    max_cruise: [1500, 1700, 2750]
    flight_idle: 3450
    thrust_reverse: 4460
  limiting_times_s: [40, 875, 1700]
  limiting_times_note: 40 s into the takeoff transient, 875 s (max climb) and 1700 s (max cruise) give the minimum lives
  as_printed: "Table XVIII labels 875 s 'End of Max Cruise' where Fig.54-55 call the same instant 'Max Climb'; the profile of Fig.53 has the climb running to 24 minutes"
  fig53_transient:
    src: "Fig.53 p.100 — read off"
    rpm: {ground_idle: 11700, max_takeoff: 13300, end_of_climb: 12800, max_cruise: 12600}
    t3_C: {ground_idle: 380, max_takeoff: 615, end_of_climb: 545, max_cruise: 530}
    altitude_km: {climb_end_min: 24, cruise: 10.7}
    delta_t_amb_C: {takeoff: 11, cruise: 10}
  bore_stress_note: CLASS-MASS gives only the hoop stress at a bore (radial is zero there); the compressive axial stresses from the axial temperature gradient and the bore width need FINITE
  hole_analysis: FINITE with constant-strain quadrilaterals on half a bolthole by symmetry; CLASS-MASS displacements as boundary conditions at the inner and outer radii; shell stiffness near holes reduced (orthotropic); bolt centrifugal load at nodes round the hole; Peterson factors as the alternative

