        - {MPa: 255, ksi: 37, C: 584, F: 1084, lcf: ">5e4"}
        - {MPa: 48, ksi: 7, C: 593, F: 1100, lcf: ">5e4"}
        - {MPa: 28, ksi: 4, C: 627, F: 1160, lcf: ">5e4"}
        - {MPa: 490, ksi: 71, C: 613, F: 1136, lcf: ">5e4"}
        - {MPa: 841, ksi: 122, C: 441, F: 826, lcf: ">5e4", where: OGV bolt flange}
  stage1_nozzle:
    src: "sec 5.2.2.3 pp.157-162; Figs.97-101"
    vanes: 46
    vane_material: MA754
    vanes_per_segment: 2
    segments: 23
    band_material: MAR-M-509, cast, compartmentalised impingement and film cavities, integral gussets
    joint: brazed airfoil to band
    cooling: forward and aft impingement inserts separated by a slanted rib (which also enlarges the insert inlet area); forward insert in from the inner flowpath and brazed at that end, aft insert in from the outer and brazed there; leading-edge showerhead; inner and outer band impingement plates; flowpath flat seals between segments
    bolts_to_inner_support: {count: 46, per_segment: 2}
    positioning: one pin per segment at a band-flange end, radial and circumferential
    seals: [E seal, chordal seal, segmented air-cavity discourager seal; bolts recessed in the seal for windage]
    flange:
      src: "Fig.99 p.163 — FPS base stage-1 inner nozzle flange, 15 s into accel, MAR-M-509 band"
      loads: gas-load moments plus the inner/outer axial-support mismatch in transients
      max_at_s_after_takeoff: 15
      allowable_text_MPa: 269
      allowable_text_ksi: 39
      allowable_figure_MPa: 262
      allowable_figure_ksi: 38
      allowable_basis: -3 sigma 0.2 percent yield, MAR-M-509
      moment_N_m: 24.97
      moment_in_lb: 221
      flange_stress_with_gussets_MPa: 193
      flange_stress_with_gussets_ksi: 28
      as_printed: "the text gives the allowable as 269 MPa (39 ksi), the figure 262 (38). Both recorded."
    aft_cavity_wall_ballooning:
      src: "Fig.100 p.164 — suction-side panel creep bulge vs time"
      issue: high pressure differential on the aft-cavity suction-side wall bulges it and changes the aerodynamic contour
      analysis: MASS, orthotropic MA754 moduli, wall as panel sectors; rib placed to minimise panel stress; 3 sigma properties
      delta_p_kPa: 1269
      delta_p_psi: 184
      wall_temperature_at_max_bulge_C: 954
      wall_temperature_at_max_bulge_F: 1750
      panel_cm: {top: 2.85, height: 4.29, bottom: 1.90}
      panel_in: {top: 1.06, height: 1.69, bottom: 0.75}
      bulge_mm: 0.05
      bulge_in: 0.002
      after_hours_at_max_takeoff: 600
      bulge_at_3000h_mm: 0.08
      as_printed: "the panel top prints 2.85 cm (1.06 in); 1.06 in is 2.69 cm and 2.85 cm is 1.12 in. The other two dimensions convert."
    airfoil_lcf:
      src: "Fig.101"
      limiting_span_pct: 65
      strain_range: max takeoff transient through a 2-minute takeoff and a chop to idle; thermal stresses plus the moment from the inner/outer nozzle-support axial thermal mismatch
      conditions: maximum peak gas temperature profile, full deterioration, hot-day takeoff
      max_peak_gas_temperature_C: 1740
      max_peak_gas_temperature_F: 3163
      basis: average profile from the cycle plus the combustor pattern factor
      design_adder_C: 78
      design_adder_F: 140
      adder_for: engine-to-engine variation, deterioration, control tolerance
      lcf_map:
        src: "Fig.101 p.165 — stage-1 nozzle airfoil LCF at 65 percent span, maximum takeoff, idle to max takeoff to idle; MA754; C (F), MPa (ksi), cycles to crack initiation"
        points:
          - {where: leading edge, C: 1027, F: 1881, MPa: 386, ksi: 56, cycles: 5000}
          - {where: suction side forward, C: 866, F: 1590, MPa: 510, ksi: 74, cycles: 6000}
          - {where: suction side aft, C: 878, F: 1612, MPa: 414, ksi: 60, cycles: 20000, ge: true}
          - {where: suction side mid, C: 945, F: 1733, MPa: 310, ksi: 45, cycles: 20000, ge: true}
          - {where: rib, C: 904, F: 1660, MPa: 386, ksi: 56, cycles: 20000, ge: true}
          - {where: suction side near TE, C: 914, F: 1677, MPa: 379, ksi: 55, cycles: 37000}
          - {where: pressure side forward, C: 945, F: 1733, MPa: 365, ksi: 53, cycles: 20000, ge: true}
          - {where: pressure side, C: 888, F: 1631, MPa: 462, ksi: 67, cycles: 8000}
          - {where: pressure side aft, C: 842, F: 1548, MPa: 441, ksi: 64, cycles: 20000, ge: true}
          - {where: trailing edge, C: 991, F: 1815, MPa: 427, ksi: 62, cycles: 3500}
        finding: >
          At maximum-severity conditions the stage-1 vane's trailing edge
          initiates a crack in 3,500 cycles and the leading edge in 5,000,
          against Table XV's 9,000-cycle service life for flowpath parts.
          The report does not remark on it; the conditions are the
          maximum-severity profile with full deterioration on a hot day,
          not the mission mix, and Table XV allows repair. It is the
          shortest calculated life in the turbine. Recorded as a finding.
  stage2_nozzle:
    src: "sec 5.2.2.4 p.162 onward; Fig.102"
    vanes: 48
    vane_material: Rene 150
    vanes_per_segment: 2
    segments: 24
    band_material: Rene 80
    joint: brazed pairs
    why_rene_150: LCF and rupture over Rene 80 or Rene 125, which bought lower cooling flow at the 18,000-cycle life
    features:
      src: "Fig.102 p.166; text pp.162-167"
      mount: bolted to a single outer-casing flange, simply supported at a forward hook, and bolted together at an integral manifold under the inner band -- one structure that carries the cooling manifolds and the interstage seal
      cooling_air: compressor seventh stage, low-pressure-drop manifold, spoolies into the airfoil; also purges the interstage seal cavity between the stage-1 aft retainer and the stage-2 damper
      fastener_per_segment: {count: 1, diameter_cm: 0.635, diameter_in: 0.25, material: Waspaloy}
      seals: {forward: 6, inner_discourager: 6, interstage_flat: 6, flowpath: hourglass}
      windage: no holes or slots
      do_change_capability_pct: 4
      gussets: forward for airfoil load redistribution, aft
      cold_position: set so the nozzle sits on the design flowpath at maximum climb when hot
      airfoil: one cavity with a single impingement insert; spanwise and chordwise ribs hold the impingement distance; thicker suction-side wall with extended ribs against ballooning; turbulence promoters and trailing-edge slots
    lcf:
      src: "Fig.104 p.169 — Rene 150, max takeoff accel to decel; C (F), cycles"
      limiting: {location: trailing edge, span_pct: 65, cycles: 20000, C: 1056, F: 1932}
      goal_cycles: 18000
      span_95: [[1006, 1843, 56000], [953, 1748, 39000], [927, 1700, 100000], [922, 1692, 100000], [928, 1703, 100000], [959, 1759, 100000], [948, 1738, 100000]]
      span_65: [[1056, 1932, 20000], [989, 1812, 100000], [978, 1792, 100000], [997, 1827, 100000], [1037, 1898, 100000], [987, 1808, 100000], [899, 1651, 100000]]
      note: "'>1e5' carried as 100000; the 65 percent section runs 30-70 C hotter than the 95 percent and is the limiting one"
    flange_stresses:
      src: "Fig.105 p.170 — gas loads at takeoff; below Rene 80 0.2 percent yield"
      outer_hook_MPa: 202
      outer_hook_ksi: 29.3
      bolt_flange_MPa: 175
      bolt_flange_ksi: 25.4

  ceramic_shrouds:
    src: "sec 5.2.3.1 p.167 onward"
    why_life_limiting: the wall opposite the stage-1 tips sees combustor gas leaving nozzle 1 near Mach 1, with tip-leakage flow patterns -- high convection and heat load, and a large cooling-air demand on a metal shroud
    status: to follow
