design_criteria:
  src: "sec 5.1.4 pp.103-104"
  basis: FPS life goals; GE Design Practice; life from material test curves (stress at temperature vs cycles or hours)
  factors: [stress rupture, creep, yield, LCF, HCF, fracture mechanics]
  creep_limit_total_pct: 0.2
  lcf_definition: failure under 1e5 cycles, from -3 sigma data at the stress and temperature including concentration factors at holes
  hcf_definition: failure beyond 1e7 cycles; vibratory stress from the pulsating nozzle gas pressure, combined with centrifugal, gas-bending and thermal steady stress, at concentrations
  fracture_mechanics: current PM alloys fall below forged LCF because of undetectable surface and subsurface defects; predicted by fracture mechanics and accounted for in life; cleaner-powder programmes in progress

rotor_components:
  src: "sec 5.2.1 pp.105 onward; Fig.56 p.106"
  parts: [forward HP shaft, outer liner, inducer seal disk, impeller, stage-1 blade and disk, interstage seal disk, stage-2 blade and disk, boltless retainers, aft shaft and disk, inner tube, sheet-metal damper, curved vanes for vortex-whistle control, balance plane, blade plane]
  forward_hp_shaft:
    src: "sec 5.2.1.1 p.105; Fig.57"
    feature: two seal teeth slightly overhung from the forward flange; FE analysis of the overhang fillet
    max_stress_forward_flange_face_MPa: 958
    max_stress_forward_flange_face_ksi: 139
    at_s: 40
    lcf_life_inco_718_cycles: 11000
    max_concentrated_stress_aft_flange_bolt_circle_MPa: 931
    max_concentrated_stress_aft_flange_bolt_circle_ksi: 135
    lcf_life_standard_inco_718_3sigma_cycles: 14000
    icls_material: Inco 718
    fps_material: Super Inco 718 (CF6-50 turbine practice; grain-size control)
    fps_lcf_life_cycles: 36000
    note: the ICLS shaft is short of the 36,000-cycle goal by design; the FPS gets there on material, not geometry
  outer_liner:
    material: Rene 95
    max_stress_location: cooling-air holes
    max_stress_MPa: 951
    max_stress_ksi: 138
    at_s: 40
    lcf_life_cycles: ">36,000"
  inducer_disk:
    src: "sec 5.2.1.2 p.105; Fig.58"
    material: AF115
    bolthole_shape: race track
    why: [lower hoop stress with concentration than a round hole (the radial stress with concentration is lower still), stops bolt-stud rotation at assembly -- the stud carries a matching race-track collar]
    lcf_objective_cycles: 36000
    verdict: met at every location (Fig.58)
  impeller_and_stage1_retention:
    src: "sec 5.2.1.3 p.108; Figs.59-60 pp.109-110"
    stage1_blades: 76
    seal_plates: 76
    seal_plate_function: one per dovetail slot, engaging the upper tang; limits purge air into the cavity between the disk front and the stage-1 inner nozzle support, so the CDP purge exits into the flowpath between blade 1 and nozzle 1
    impeller_functions: [coolant-air pumping, axial blade retention, support for the blade wire seal (which cuts blade-coolant leakage)]
    u_clip: axially retains the seal plates; windage cover for the disk-post extension; one sawcut for assembly; a 360-degree retaining ring snaps in after it
    material: AF115
    model: CLASS-MASS with the radial vanes and the support-arm serrations as orthotropic shells without hoop stiffness; density adjusted to the equivalent shell thickness; shell thickness from equivalent bending stiffness; vane stress from the resulting loads
    race_track_holes: 38
    race_track_holes_purpose: passage of the expander air that cools the stage-1 blades
    max_stress_at_s: 40
    lcf_life_cycles: ">36,000"
    fig60:
