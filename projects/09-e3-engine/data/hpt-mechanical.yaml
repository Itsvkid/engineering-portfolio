    retention: split lock ring between the retainer and the disk-web "ear"; axial blade load to the outer end of the retainer; reaction at the ring and the ear; radial support by the rabbet on the disk post
    features: [antirotation lugs, wire seal, rabbet radial retention, split lock ring, disk-web ear]
    loads: [delta-pressure on the outer and inner arms, blade axial load at the wire seal, reaction at the ear]
    analysis: FINITE, boundary conditions from CLASS/MASS at 40 s
    stage1_aft_retainer:
      src: "Fig.67 p.119 — 40 s; temperature contours and FE effective stress"
      temperatures_C_F: [[678, 1252], [676, 1249], [750, 1382], [521, 970], [570, 1058], [698, 1288], [567, 1053], [339, 642], [598, 1108]]
