# ─────────────────────────────────────────────────────────────────────────
# COMBUSTOR — double annular.  Not cannular.
# ─────────────────────────────────────────────────────────────────────────
combustor:
  src: "CR-168219 sec 5.3 pp.57-62; Fig.22 p.59"
  type: double annular, short length
  zones:
    outer: pilot — used alone at low power, tuned for low fuel-air ratio
    inner: main — used with pilot at high power, tuned for higher fuel-air ratio
  swirl_cup_count: 60
  fuel_nozzle_count: 30
  fuel_nozzle_type: dual-tip duplex, both tips on one stem, independent metering per nozzle
  support_pin_count: 30
  counts_src: "sec 5.3.2 p.61"
  prediffuser:
    type: split duct
    outer_passage_fraction: 0.48   # to pilot dome
    inner_passage_fraction: 0.52   # to main dome
    src: "sec 5.3.1 p.57"
  dome_cups: axial primary swirler plus counter-rotating radial secondary swirler, each cup
  liner:
    construction: double wall, segmented shingles, impingement plus spent-film cooling
    shingle_rows_axial: 3
    holes: laser drilled into forged support liners
    src: "sec 5.3.1 p.61, sec 5.3.2 pp.61-62"
  seals: fishmouth at combustor-to-stator interface
  materials:
    src: "sec 5.3 p.57"
    casing: Inco 718
    diffuser: Inco 718
    fuel_nozzle_body: stainless steel
    dome: Hastelloy X
    shingles: X-40
    thermal_barrier_coating: on dome and shingle liners
  pressure_drop: 0.050
  pressure_drop_note: set by the minimum required for the HPT vane cooling air circuit — sec 5.3.3 p.62
  test_hours: {rig: 320, core_and_icls_engine: 109}
  test_hours_src: "sec 5.3.3 p.62"

