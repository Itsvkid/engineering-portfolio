# HPT report CR-167955 Figure 5c, "Blading Parameters" -- stage energy
# extraction against annulus height, read off the 300 dpi scan by
# tools/read_hpt_fig5.py (not by eye). The page carries NASA's own
# "ORIGINAL PAGE IS OF POOR QUALITY" stamp; see the uncertainty below.

meta:
  src: "CR-167955 Fig.5c p.13 (PDF page 22); extracted by tools/read_hpt_fig5.py"
  transcribed: 2026-09-06
  method: rightmost thin dark run per scan line inside the plot box, excluding gridlines and box edges
  read_off_uncertainty_kJ_kg: 5
  axis: {y: annulus height percent, x: stage energy extraction kJ/kg}
  as_printed: >
    The stage-1 panel's four labelled gridlines are evenly spaced to
    under a pixel (289.7 px per 50 kJ/kg), so its box spans exactly
    200-350. The stage-2 panel's single interior gridline sits 303.5 px
    from its left edge; at the stage-1 scale that is 252.4, not the 250
    it is labelled, and its right-hand box edge falls at about 295-299
    rather than the 300 the axis suggests. Calibrating on the two
    labelled gridlines gives a scale 5.6 percent finer than assuming 300
    at the edge. Recorded, not corrected: the panel is hand-drawn and
    the page carries NASA's own poor-quality stamp.

