materials:
  src: "Table V p.49 — fan rotor list of materials; sec III.B p.48"
  fan_blades: Titanium 6Al-4V
  fan_disk: Titanium 6Al-4V
  spinner: 7075 aluminium
  spinner_cover: 7075 aluminium
  anticlank_spring: Titanium 6Al-4V
  blade_retention_key: Inco 718
  booster_spool: Titanium 6Al-4V
  booster_blade: Titanium 6Al-4V
  fan_shaft_bolts: {size_in: 0.625, material: Inco 718}
  forward_fan_shaft: {demonstrator: 4340 steel, fps_intended: MARAGE 250, why: MARAGE 250 unavailable in time}
  design_goals:
    vibratory_margin_over_2_per_rev_pct: 15
    others: [rotor stiffness for coupled disk/blade frequency margins, attachments stronger than airfoils in the lower modes, bird-strike capability, low dovetail stress, dovetail posts to survive blade loss, anticlank against dovetail wear, torque capacity of the disk/shaft joint, reduced overhang, modular disassembly]
    shroud_note: the part-span shroud sits lower (55 percent) and the blade is thickened at midspan for flexural margin over 2/rev; the weight is bought back by blade efficiency and bird-strike resistance

vector_diagram_rows:
  src: "Appendix A pp.118-127 — CAFD blade-row printouts, metric; the per-row summary block of each page (streamline rows to follow)"
  corrected_speed_rpm: 3727.7
  rows:
    R1_fan:        {src: "pp.118-119 (metric) / 125-126 (English)", inlet_corr_flow_lbm_s: 1419.16, pressure_ratio: 1.6342, temperature_ratio: 1.1646, adiabatic_efficiency: 0.917, blades: 32}
    S1_island:     {src: "p.120", inlet_corr_flow_kg_s: 143.74, pressure_ratio: 1.4585, temperature_ratio: 1.1256, adiabatic_efficiency: 0.909, blades: 60, aspect_ratio: 1.96}
    R2_booster:    {src: "p.121", inlet_corr_flow_kg_s: 143.74, pressure_ratio: 1.6838, temperature_ratio: 1.1776, adiabatic_efficiency: 0.904, blades: 56, aspect_ratio: 2.13}
    S2IN_inner_ogv: {src: "p.122", inlet_corr_flow_kg_s: 82.39, pressure_ratio: 1.6676, temperature_ratio: 1.1791, adiabatic_efficiency: 0.888, blades: 64, aspect_ratio: 0.83}
    S2OUT_island_exit: {src: "p.123", inlet_corr_flow_kg_s: 61.35, pressure_ratio: 1.6393, temperature_ratio: 1.1755, adiabatic_efficiency: 0.865, blades: 34, aspect_ratio: 0.18, aspect_ratio_note: "prints '0.18'; faint, possibly 8.18 -- not used"}
    OGV_bypass:    {src: "p.124", inlet_corr_flow_kg_s: 499.98, pressure_ratio: 1.6517, temperature_ratio: 1.1757, adiabatic_efficiency: 0.879, blades: 34, aspect_ratio: 1.13}
  reading: >
    The printout's pressure and temperature ratios are cumulative from
    the fan inlet ("ACC PT RATIO"), so S2IN's 1.6676 is the core-stream
    pressure ratio (Table I: 1.67) and the bypass OGV's 1.6517 the bypass
    ratio (1.65). Flows: 143.74 kg/s goes under the island (22.3 percent
    of 643.7); 61.35 of it returns to the bypass at S2OUT (42.7 percent,
    "approximately 42"); 82.39 enters the core; 499.98 passes over the
    island (643.7 - 143.74). Every split closes to 0.1 kg/s.

fan_rotor_airfoil:
  src: "sec II.A pp.9-22; Figs.10-16"
  sections: transonic outboard, subsonic near the hub; 12 axisymmetric streamsurfaces; GE Streamsurface Blade Section program; supersonic inlet on every streamline above the island, 1.02 at 78 percent flow down to 0.70 at the hub
  incidence_deg: {design_point_all_span: 5, suction_surface_tip: 0.5, suction_surface_hub: "2-3"}
  free_flow_streamline: the suction surface upstream of the first captured Mach wave is offset from the free-flow streamline for leading-edge thickness, bow-wave loss and boundary-layer growth
  hub_section: {m_le: 0.70, m_te: 0.75, tool: CASC, surface_mach: nearly constant suction-surface Mach after a small initial diffusion (Fig.14)}
  tip_section: {src: "Fig.10", m_le: 1.41, m_te: 0.87, throat_margin_pct: 7.5, a_throat_over_a_mouth: 0.976, a_throat_over_a_exit: 0.959, suction_surface_mach_range: [1.3, 1.5]}
  shroud_section: {src: "Fig.11", psi: 0.58, m_le: 1.15, m_te: 0.68}
  throat_margin_pct: {typical: 5, od: 7.5, id: 8.8, basis: effective throat-to-capture area ratio above critical after one normal shock at the leading-edge Mach}
  mouth_to_throat_contraction_pct: "2-2.5"
  contraction_rule: must not exceed the critical contraction ratio after one normal shock at the mouth Mach, so the leading-edge shock stays oblique at maximum climb ("starting margin")
  max_thickness_location_pct_chord: {tip: 59, above_island: 55, hub: 42, shroud_region: 58}
  thickness_distribution: quarter-sine from the leading edge to the maximum, reversed to the trailing edge; slightly thicker leading edges just below the island
  shroud:
    height_pct: 55
    stacking_axis_point_pct_axial_chord: 65
    le_pct_axial_chord: 48
    te_pct_axial_chord: 82
    thickness_cm: 0.89
    thickness_in: 0.35
    shape: nearly elliptical thickness distribution
  fig15:
    src: "Fig.15 p.21 — fan rotor chord and solidity vs radius; read off, plus the printed box"
    r_sa_od_in: 40.9061
    r_sa_id_in: 16.4399
    z_sa_in: 3.2253
    blade_height_in: 24.4662
    aspect_ratio: 2.597
    blades: 32
    chord_hub_cm: 18.4
    chord_tip_cm: 28.3
    solidity_hub: 2.3
    solidity_tip: 1.4
    radius_cm: [35, 40, 50, 60, 70, 80, 90, 100, 105]
    chord_cm:  [18.4, 18.9, 20.1, 21.8, 23.3, 24.9, 26.3, 27.6, 28.3]
  fig16_tm_over_c:
    src: "Fig.16 p.22 — read off"
    radius_cm: [35, 40, 45, 50, 55, 60, 70, 76, 80, 90, 100, 105]
    tm_c:      [0.127, 0.11, 0.085, 0.066, 0.06, 0.053, 0.046, 0.043, 0.039, 0.033, 0.028, 0.026]
    shroud_radius_cm: 76
  appendix_b: manufacturing-plane section geometry tabulated (p.134) -- A3

stator1_airfoil:
  src: "sec II.B pp.20-23; Figs.17-20"
  method: as the rotor -- vector diagrams at LE, TE and intrablade stations; thickness and meanline per streamline; each cascade analysed with CASC, exit angles related to CAFD's by an empirical factor
  vanes: 60
  od: {inlet_mach: 0.73, thickness: 65-series, tm_c: 0.062}
  id: {inlet_mach: 0.85, thickness: first quarter-sine to maximum thickness at 38 percent chord then 65-series, tm_c: 0.049}
  intermediate: linear blend OD to ID
  meanline: slightly modified circular arc on every streamline
  chord_cm: 8.10
  chord_in: 3.19
  chord_constant: true
  exit_swirl_deg: {tip: 12, hub: 8, why: loading balance between this row and the inner OGV}
  incidence_deg: {all_but_hub: "just under 1", hub: 3, hub_why: higher swirl expected off the rotor hub from secondary flow}
  throat: at the cascade mouth; margin 6-8 percent above critical
  stacking: 50 percent chord; plane-section cuts for manufacturing (Appendix C)
  surface_mach: {tip_peak: 1.03, hub_peak: 1.15, exit: 0.6}

booster_rotor_airfoil:
  src: "sec II.C pp.23-28; Figs.21-24"
  blades: 56
  aspect_ratio_text: 2.09
  aspect_ratio_table_iv: 2.12
  as_printed: "the text gives 2.09, Table IV 2.12. Both recorded."
  thickness: quarter-sine to maximum then 65-series
  meanline: modified circular arc
  tm_c: {tip: 0.049, hub: 0.081}
  chord_cm: {tip: 6.35, hub: 7.11}
  chord_in: {tip: 2.50, hub: 2.80}
  chord_variation: linear
  throat_margin_pct: "5-6"
  tip: {turning: slight, solidity: low, suction_peak_mach: 1.05, exit_mach: 0.73}
  hub: {pressure_ratio_required: 1.68, solidity: 1.2, camber_deg: 32, suction_peak_mach: 1.08, diffusion: delayed to the last 40 percent of chord}
  deviation: CASC exit angles with an empirical adjustment including the secondary flow from the non-uniform loading and incoming free-stream vorticity
  stacking: plane-section centres of gravity on the radial stacking axis (Appendix D)

inner_ogv_airfoil:
  src: "sec II.D pp.28-30; Figs.25-29"
  vanes: 64
  purpose: remove the booster swirl and turn the flow into the core duct
  blade_axis: curved in space, swept aft 60 degrees from radial, leaned circumferentially from 0 at the OD to 20 degrees at the ID with the pressure side facing the axis
  sweep_why: compatible with the core-duct entry flowpath
  lean_why: the 20-degree lean's downward radial force raises hub static pressure and lowers the hub inlet Mach and diffusion; lean drops sharply to zero at the OD to avoid an acute angle between suction surface and outer flowpath
  chord_cm: {od: 5.44, id: 9.25}
  chord_in: {od: 2.14, id: 3.64}
  tm_c: {od: 0.066, inner_50pct_span: 0.053}
  thickness: quarter-sine/65-series
  cascade_mach: perpendicular components of the full Mach number in planes normal to the swept and leaned stacking axis
  peak_suction_mach_location_pct_chord: 30
  end_effect_camber_adjustment_deg: {tip: {value: 7.8, at_pct_chord: 50}, hub: {value: -4.7, at_pct_chord: 40}, method: Reference 4, attenuated}
  sections: on planes perpendicular to the swept and leaned axis (Appendix E)

bypass_ogv_vane_frame:
  src: "sec II.E pp.30 onward; Figs.30-38"
  vanes: 34
  complication: a 40.6 cm (16 in) thick pylon at top dead centre just behind the vane trailing edges, and a thick bottom (180 degree) strut for the radial drive shaft and accessory pipes
  method: circumferential-average solution with vane and pylon blockage and the island TE static-pressure match; a 2-D stream-surface analysis at pitch for the circumferential pressure and angle variation (Figs.31-32); a coarse 3-D finite-element analysis on five streamline sections for the radial trend of exit angle
  finding: significant circumferential variation at the OGV inlet and exit planes, essentially none at the fan rotor exit plane
  pylon_thickness_cm: 40.6
  pylon_thickness_in: 16
  pylon_location_deg: 0
  bottom_strut_location_deg: 180
  required_exit_angle_shift_deg: {beside_pylon: [7, -7], at_90_and_270: [3, -3], at_180: 0}
  camber_groups: 5
  inlet_spacing: held constant between vanes
  bottom_vanes: nominal type with chords cut back beside the thick strut and fairing (Fig.35)
  tip_incidence_deg: 3
  tip_incidence_why: higher swirl in the casing boundary layer
  island_sections: the island upper (I) and lower (H-I) surfaces show opposite Mach trends, from matching static pressure at the island trailing edge between two streams of different total pressure
  fig31_pitch_pressures: {rotor_exit_total_kPa: 172, stator_exit_static_kPa: 137, rotor_exit_static_kPa: 127, stator_inlet_static_kPa: 118, note: "N/m2 x 1e5 read as 1.72, 1.37, 1.27, 1.18; the bottom strut puts a 0.05-bar dip in the inlet static at 180 degrees"}
  fig32_inlet_angle_deg: {mean: 36, range: [33.5, 38.5], spike_at_180: true}
  geometry: five vane groups tabulated in Appendix F (p.138)

fan_rotor_mechanical:
  src: "sec III pp.36-59; Figs.39-49"
  configuration: 32 blades shrouded at 55 percent span; 56-blade booster; drop-down dovetail slot for individual blade replacement; anticlank spring preloads the blade outward in the slot; axial retention integrated with it
