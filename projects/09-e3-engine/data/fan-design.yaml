rotor_structure:
  src: "sec III.E p.69; Figs.58-61"
  method: CLASS/MASS thin shells for the rotor with AFINE for the thick-shell stage-1 and -2 disks; blade radial loads and moments at the rims, bearing restraints on the shafting; deflections set the blade lengths for cold dimensioning
  fan_disk:
    src: "Fig.59 p.71 — AFINE; N = 3653 rpm; kN/cm2 (ksi), deflections cm (in)"
    max_stress_kN_cm2: 39.3
    max_stress_ksi: 57
    max_stress_pct_of_lcf_limit: 58
    lcf_cycles: 72000
    burst_strength_pct_of_design_speed: 147
    stresses_kN_cm2_ksi: [[37.9, 55], [26.2, 38], [37.2, 54], [39.3, 57], [31.0, 45], [31.0, 45], [24.1, 35], [31.7, 46], [33.1, 48], [31.7, 46], [37.9, 55], [10.3, 15], [7.6, 11]]
    deflections_cm_in: [[0.071, 0.028], [0.068, 0.027], [0.074, 0.029], [0.066, 0.026], [0.061, 0.024], [0.058, 0.023], [0.048, 0.019], [0.045, 0.018], [0.010, 0.004]]
    design: sized for growth so lightly stressed at FPS; shaft curve contoured to spread disk deflection over several inches of shaft; non-symmetric section with the centre of gravity aft of the stacking axis so the blade, shroud, gas and shaft-restraint moments cancel and the disk does not roll; the eccentric contour also lets the No.1 bearing sit closer to the fan centreline
  booster_spool:
    src: "Fig.60 p.72 — N = 3653 rpm"
    stresses_kN_cm2_ksi: [[24.8, 36], [17.9, 26], [22.1, 32], [23.4, 34], [20.7, 30], [17.2, 25], [15.8, 23], [19.3, 28], [17.9, 26], [11.5, 17], [14.5, 21], [16.5, 24], [24.8, 36], [26.2, 38], [13.1, 19], [13.8, 20], [12.4, 18], [21.4, 31]]
    deflections_cm_in: [[0.093, 0.0368], [0.088, 0.0347], [0.092, 0.0362], [0.092, 0.0364], [0.086, 0.0338], [0.092, 0.0362]]
    design: bore projection placed to counter the rim moment from blade and spacer; bore length sized to keep the disk's vibratory frequencies out of the fan operating range
    as_printed: "'11.5 (17)': 17 ksi is 11.7 kN/cm2. The other seventeen pairs convert."
  disk_shaft_joint:
    src: "Fig.61 p.73; text p.69"
    bolts: 30
    bolt_size_in: 0.625
    bolt_material: Inconel 718
    shaft_material: Ti 6-4
    preload_kN_per_bolt: 101.9
    preload_lb_per_bolt: 22914
    friction_coefficient: 0.15
    principle: torque through flange friction, never bolt shear; tight-fitting bolts stop joint shift and bolt bending; more, smaller bolts for a lighter flange
    loads_reacted: [fan, No.1 bearing net resultant, LP turbine]

