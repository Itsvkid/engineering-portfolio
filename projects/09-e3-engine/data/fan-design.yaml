# E3 fan and quarter-stage booster — design point, as printed.
# Source: NASA CR-165148, "Energy Efficient Engine Fan Test Hardware
# Detailed Design Report" (GE; Sullivan, Luebering, Gravitt; October
# 1980). PDF page = report page + 10. US Government work.
#
# Every value carries its source; nothing is corrected; prints and
# cross-report disagreements are recorded by name.

meta:
  source: e3-fan-hardware-design-CR-165148.pdf
  pages_read: "1-14, 46-49, 118-127"
  transcribed: 2026-09-05
  status: secs I-III complete with Table VI; sec IV stator geometry (Table VII, Figs 74-76) and Campbell notes; frame analysis, containment and Table VIII to follow; appendix streamline rows are A3

summary:
  src: "Introduction and Summary pp.1-3; abstract"
  configuration: single-stage fan with a quarter-stage booster on an island; chosen over a single higher-tip-speed rotor for core-stream efficiency, an easier growth path, better bypass efficiency at the lower fan speed, and foreign-object separation by the island
  design_point: maximum climb, Mach 0.80, 10,668 m (35,000 ft)
  inlet_radius_ratio: 0.342
  specific_flow_kg_s_m2: 208.9
  specific_flow_lbm_s_ft2: 42.8
  fan_blades: 32
  fan_aspect_ratio: 2.597
  part_span_shroud_height_pct: 55
  part_span_shroud_cross_report: "CR-168219 sec 5.1.2 p.45 says '50 percent span shrouds'; this report says 55 percent of blade height on the stacking axis (p.3, Fig.2). Recorded, both kept; the fan report is the detail design."
  corrected_tip_speed_m_s: 411.5
  corrected_tip_speed_ft_s: 1350
  fan_tip_diameter_m: 2.108
  fan_tip_diameter_in: 83
  spinner_half_angle_deg: 32
  island_split_pct_of_total_flow: 22.3
  booster_flow_returning_to_bypass_pct: 42
  bypass_ratio: 6.8
  core_stream_pressure_ratio: 1.67
  bypass_pressure_ratio: 1.65
  core_duct_loss_pct: 1.8
  core_corrected_flow_kg_s: 54.4
  core_corrected_flow_lbm_s: 120
  ogv_spacing_rotor_tip_chords: 1.8
  ogv_camber_families: 5
  life: {missions: 36000, stress_cycles_per_mission: 2}
  structure: aluminium non-structural spinner, titanium high-bore ring disk, one-piece titanium quarter-stage spool, steel fan shaft; modular removal of shaft, rotor, or fan module from the HPC forward face
  containment_icls: slave design -- modified CF6 steel outer casing with bolted-in wooden flowpath panels; steel slave vane-frame
  materials_basis: average minus three standard deviations, with section-size effects
  no_coupled_mode_resonance: in the operating range between rotor and fan case

