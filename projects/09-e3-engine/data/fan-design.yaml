      second_flex:   {at_0: 205, at_3653_range: [235, 300], nodal_diameters_shown: [2, 3, 4]}
      first_torsion: {at_0: 320, at_3653_range: [370, 400], nodal_diameters_shown: [2, 4]}
    first_flex_margin_over_2_per_rev_pct: 14.6
    goal_margin_pct: 15
    first_flex_crossings: 3/rev and above at speeds low enough to be out of the operating range
    torsional_stall_flutter: protected at all speeds
    platform_corner_frequency: well above stator passing, by correlation from a similar blade
    note: "14.6 percent against a 15 percent goal -- 'meets the design goal' as printed"
  shroud:
