fan_stator:
  src: "sec IV.C pp.84-100; Fig.74 p.90; Table VII p.92; Figs.75-82"
  assembly: stage-1 vanes individual, loaded axially into a 360-degree inner shroud and a 360-degree outer fairing that also forms the island upper flowpath; core OGVs individual, through loading slots into their 360-degree inner shroud, bolted to the core frame, with a 360-degree outer fairing forming the splitter upper flowpath
  materials_icls:
    src: "Fig.74"
    outer_panels: {count: 4, arc_deg: 90, material: 6061-T6}
    case_360: 2024-T6
    fairing_360_outer: 6061-T6
    stage1_vanes: 403 SS
    stage1_shroud_360: 17-4 PH
    stage1_fairing_360: 17-4 PH
    core_ogv_vanes: 7075-T73 aluminium
    core_ogv_shroud_360: 6061-T6
    seals: porous Teflon
  geometry:
    src: "Table VII p.92 — fan stator geometry summary"
    rows:
      - {stator: stage_1, vanes: 60, material_icls: 403 SS, material_fps: Ti 6-4, length_cm: 15.67, length_in: 6.17, chord_root_cm: 8.13, chord_root_in: 3.20, chord_tip_cm: 8.10, chord_tip_in: 3.19, tm_c_root_as_printed: 0.485, tm_c_root_taken: 0.0485, tm_c_tip: 0.062, stagger_root_deg: 20.27, stagger_tip_deg: 21.51, camber_root_deg: 37.29, camber_tip_deg: 35.79, aspect_ratio: 1.935}
      - {stator: inner_ogv, vanes: 64, material_icls: 7075 Al, material_fps: 7075 Al, length_cm: 11.61, length_in: 4.58, chord_root_cm: 9.25, chord_root_in: 3.64, chord_tip_cm: 5.44, chord_tip_in: 2.14, tm_c_root: 0.053, tm_c_tip: 0.062, stagger_root_deg: 18.40, stagger_tip_deg: 21.53, camber_root_deg: 55.38, camber_tip_deg: 62.38, aspect_ratio: 1.39}
      - {stator: bypass, vanes: 34, material_icls: 17-4 PH, material_fps: composite, length_cm: 43.18, length_in: 17.0, chord_root_cm: 31.27, chord_root_in: 12.31, chord_tip_cm: 27.74, chord_tip_in: 10.92, tm_c_root: 0.056, tm_c_tip: 0.073, stagger_root_deg: 14.67, stagger_tip_deg: 14.71, camber_root_deg: 29.20, camber_tip_deg: 46.54, aspect_ratio: 2.89}
    as_printed:
      - "stage-1 root tm/c prints '0.485'; Fig.75 gives 0.048 at the root and the tip prints 0.062, so a dropped zero: 0.0485 taken"
      - "the inner-OGV and bypass aspect ratios (1.39, 2.89) are not length over mean chord (1.58, 1.46); stage 1's is (1.93). Definition not stated; recorded as printed"
      - "Appendix A prints AR 1.96 for S1 (Table VII 1.935), 0.83 for the inner OGV and 1.13 for the bypass OGV -- a third set of aspect ratios for the same rows"
  fig75_stage1_tm_c: {root: 0.048, at_50pct: 0.057, tip: 0.062, shape: rising smoothly hub to tip}
  fig76_core_ogv_tm_c: {root: 0.053, constant_to_pct: 55, tip: 0.063}
  bypass_vane_note: the FSFT/ICLS bypass vane is solid steel (slave); the FPS design is a hollow composite -- so no bypass tm/c distribution is shown
  analysis: SAP-4 finite-element models of all three vanes (Figs.77-79) for steady and vibratory analysis; Campbell diagrams Figs.80-82
  campbell_findings:
    src: "p.91"
    bypass_vane: two-stripe meets 32/rev (fan blade passing) near top speed on the solid slave vane; the FPS hollow composite vane will have a higher two-stripe frequency and can be tuned away; judged no problem for FSFT/ICLS given the distance downstream and the solid section
    stage1_vane: adequate margin at maximum speed through two-stripe against fan-blade sources including twice blade passing (64/rev)
    core_ogv: no resonance at maximum speed through two-stripe; 1F and 1T lie close together, so separating them with margin over 32 and 64 per rev would need a geometry change costing aero; the main excitation is the booster's 56/rev, which resonates only at low speed; the fan's 32 and 64 per rev sit marginally close to 1T and 2T -- bench test before any modification
    growth: vanes designed to the FPS speed; the growth speed is shown for reference only
