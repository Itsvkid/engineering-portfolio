cycle_points:
  src: "Table III p.46 — fan design cycle performance parameters; FPS / growth"
  case_41_flowpath_and_clearance: {altitude_m: 10668, mach: 0.80, delta_t_C: 10, rating: max_climb, fan_physical_speed_rpm: [3539, 3939]}
  case_72_max_stress: {altitude_m: 5791, mach: 0.30, delta_t_C: 15, rating: takeoff, fan_physical_speed_rpm: [3611, 4079], at_1_2pct_overspeed_rpm: [3653, 4126]}
  cross_report: >
    The LPT report's Table VI has the same two cases with the same
    speeds, but applies a 2.6 percent overspeed (3707 / 4160) where this
    report applies 1.2 percent (3653 / 4126); and this report prints case
    72 at +15 C where the LPT report prints +35 C. Recorded, both kept.

