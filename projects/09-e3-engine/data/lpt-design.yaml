    cruise_mode: {casing: 0.42, rotor: 0.44, casing_with_cooling_air_on: 0.30}
    note: the casing grows first (thin, hot gas on it), the rotor catches up on the centrifugal field and disc heating; ACC pulls the cruise casing back 0.12 cm
