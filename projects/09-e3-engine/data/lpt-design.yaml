    bolts: [Inco 718, Inco 718]
    nuts:  [Waspaloy, Waspaloy]
  note: >
    The only ICLS-to-FPS change is the stage-1 vane, Rene 77 to Rene 125 --
    the row that sees the HPT exit hot streak. Everything rotating is
    Rene 77 blades on Inco 718 disks.

life_basis:
  src: "sec 4.1.2 p.78"
  design_limit_stresses: minus-3-sigma material properties
  hcf: Goodman diagram for the maximum allowable vibratory stress at infinite life
  aircraft_missions: 36000
  stress_cycles_per_mission_rotor: 2
  stress_cycles_rotor: 72000
  stress_cycles_other: 36000
  residual_life_with_defect_cycles: 6000
  as_printed_inconsistency: >
    Sec 4.1.2 bases life on 36,000 aircraft missions (72,000 rotor stress
    cycles); sec 4.2.1's blade LCF uses 18,000 missions (36,000 cycles);
    and the 18,000-hour design life over the 2-hour mission of Fig.51
    would be 9,000 missions. Three mission counts in one report. Each
    section's own arithmetic holds; the cross-section one does not.
    Recorded, flagged; the blade LCF requirement is taken as 36,000 cycles.
    Table XII (dovetails) and sec 4.2.3 (disks) both require 72,000 cycles
    of the disks and 36,000 of the blades -- sec 4.1.2's 36,000 missions
    is the count the structure was designed to.
  defect_size_cm: [0.025, 0.076]
  defect_size_in: [0.01, 0.03]
  design_levels: blades to FPS conditions; rotor spool and support structure to growth conditions

