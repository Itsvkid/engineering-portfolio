disks:
  src: "sec 4.2.3 pp.102-108; Figs.71-72; Tables XIII-XIV"
  sizing: each disk in proportion to the centrifugal load of its blade row
  spacer_arms: forged integrally with the disks, tapered thinner away from the web attachment; the bolt holes live here, in the low-stressed arms -- none in the load-carrying webs
  bolting_life: available clamp load exceeds requirement even after 9,000 hours of relaxation
  critical_point: transient analysis per disk for the worst combined speed and temperature gradient; stage 1's is 60 seconds into takeoff
  lcf_requirement_cycles: 72000
  overspeed: all disks meet the 120 percent redline requirement; burst margin to spare
  spacer_arm_stresses:
    src: "Fig.71 p.109 — 60 s into takeoff acceleration; read off"
    lcf_limit_MPa: 540
    lcf_limit_basis: "72,000 cycles with Kt = 1.5 for bending"
    peak_effective_MPa: 420
    metal_temperatures_C_F_front_to_rear: [[465, 870], [370, 698], [408, 766], [405, 761], [400, 753], [466, 871], [369, 697], [409, 768], [483, 901], [402, 756], [446, 853], [480, 897], [489, 912], [536, 997], [528, 982], [535, 995]]
    as_printed_inconsistency: "the pair 446 C (853 F) does not convert (853 F is 456 C; 446 C is 835 F); the other fifteen pairs do. Recorded."
  stage1_disk:
    src: "Fig.72 p.111 — stress distribution at growth conditions, 60 s into takeoff; read off"
    radius_range_cm: [24.0, 30.5]
    radius_range_in: [9.45, 12.0]
    thickness_cm: {bore: 2.4, web: 1.0, rim: 2.0}
    hoop_stress_MPa: {rim: 430, bore: 700}
    effective_stress_MPa: {rim: 400, bore: 700}
    radial_stress_MPa: {rim: 40, peak: 250, peak_radius_cm: 27.5, bore: 0}
    lcf_limit_MPa: {rim_kt_1_7: 455, bore: 700}
    lcf_limit_ksi: {rim_kt_1_7: 66, bore: 101.5}
    temperature_C_rim_to_bore: [375, 368, 362, 349, 331, 313, 310, 313]
    temperature_F_rim_to_bore: [708, 694, 684, 660, 628, 596, 590, 596]
    note: the bore sits on its 72,000-cycle limit; the rim is 25 MPa under its Kt = 1.7 limit. A disk sized to the number, both ends.
