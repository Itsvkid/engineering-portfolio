    as_printed_inconsistencies:
      - "takeoff-rotation sum at 6 o'clock prints '0.031' mm beside (-3.99) mils; -3.99 mils is -0.101 mm, which is also what the three terms above it sum to."
      - "takeoff-rotation at 12 o'clock: beam bending prints -0.114 mm beside (-4.74) mils, which is -0.120 mm; and the sum prints -0.193 mm beside (-6.69) mils, which is -0.170 mm and is what the mils terms give. Neither mm figure matches its mils."
    note: every mils sum recomputes from its mils terms; the mm column fails twice at takeoff rotation. The mils are the working column.
  stage1_combined_clearance:
    src: "Table XIX p.141 — typical LPT stage-1 combined clearance calculation; cm (in)"
    condition:                    [cold_assembly, takeoff, max_climb, cruise]
    tip_clearance_round_engine_cm: [0.058, 0.0, 0.066, 0.091]
    tip_clearance_round_engine_in: [0.023, 0.0, 0.026, 0.036]
    out_of_round_imposed_cm:       [null, 0.036, 0.051, 0.023]
    out_of_round_imposed_in:       [null, 0.014, 0.020, 0.009]
    single_point_rub_cm:           [null, -0.036, 0.015, 0.069]
    single_point_rub_in:           [null, -0.014, 0.006, 0.027]
    resultant_gap_cm:              [0.094, 0.036, 0.102, 0.127]
    resultant_gap_in:              [0.037, 0.014, 0.040, 0.050]
    acc_closure_needed_for_0_038cm_cm: [null, null, 0.064, 0.089]
    acc_closure_needed_for_0_038cm_in: [null, null, 0.025, 0.035]
    acc_closure_capability_cm:     [null, null, 0.163, 0.163]
    acc_closure_capability_in:     [null, null, 0.064, 0.064]
    takeoff_rub_depth_cm: 0.036
    goal_gap_cm: 0.038
    goal_gap_in: 0.015
    reading: >
      The round-engine clearance is zero at takeoff by choice (shroud
      diameters set so rotor and shroud touch at the minimum-closure
      point). "Single point rub" is round-engine clearance minus imposed
      out-of-round -- the local gap at the tightest clock position;
      negative at takeoff, so 0.036 cm rubs out. That rub opens every
      later gap: resultant = round-engine + 0.036. ACC closure needed =
      resultant - 0.038. Cold-assembly round-engine value is faint
      ("0.050" or "0.058"); 0.023 in is 0.058 cm and the resultant
      0.094 - 0.036 = 0.058, so 0.058 is taken.
  summary:
    src: "Table XX p.142 — summary of LPT clearance calculations"
    stage:                       [1, 3, 5]
    critical_point: takeoff
    acc_closure_needed_cm:       [0.064, 0.069, 0.114]
    acc_closure_needed_in:       [0.025, 0.027, 0.045]
    acc_closure_capability_cm:   [0.163, 0.163, 0.142]
    acc_closure_capability_in:   [0.064, 0.064, 0.056]
    operating_clearance_new_cm:  [0.010, 0.010, 0.010]
    operating_clearance_new_in:  [0.004, 0.004, 0.004]
    operating_clearance_after_max_service_cm: [0.061, 0.038, 0.094]
    operating_clearance_after_max_service_in: [0.024, 0.015, 0.037]
    rotor_tolerance_cm: 0.004
    goal_cm: 0.038
    verdict: goal met on all stages new; over goal after maximum service out-of-round
    note: stage 5 needs the most closure and has the least capability -- the largest, thinnest-cased stage

