active_clearance_control_design:
  src: "sec 4.4 pp.128-135; Figs.89-90"
  intent: run small shroud and seal clearances by directing cooling air at the shroud and seal attachment points at the right times, with a casing that survives the thermal cycling
  casing_life: the only component significantly stressed by ACC cycling; capable of more than the required 36,000 mission cycles
  manifold:
    air: fan air, impinged on the LPT case at the outer diameter of the 10 nozzle and shroud support hooks
    sectors: 4
    sector_arc_deg: 90
    layout: backbone/rib -- an axial distribution manifold with 10 circumferential tubes each side
    forward_part_tubes: 7
    forward_part_covers: stages 1-4
    aft_part_tubes: 3
    aft_part_covers: stage 5
    stage5_orifice_plate: installed at engine assembly so stage-5 impingement can be adjusted or eliminated to measure its effect
    material: 321 stainless steel, welded and brazed tube and sheet
    mounts: {forward: hard-mounted bolted joint, middle: bolted joint spring-mounted for axial slip, aft: two pins captured in the LPT aft flange}
    tube_brackets_deg: 45
    tube_geometry:
      src: "Fig.90 p.136"
      manifold_sheet_cm: 0.089
      manifold_sheet_in: 0.035
      tube_od_cm: 1.27
      tube_od_in: 0.500
      tube_wall_cm: 0.051
      tube_wall_in: 0.020
    flange_access: forward mount brackets sit aft of the HPT/LPT flange and the flange bolts insert from the aft side, so the flange separates without removing the manifold; the small bolt-head envelope lets the front tube sit over the front shroud hook at full impingement distance

