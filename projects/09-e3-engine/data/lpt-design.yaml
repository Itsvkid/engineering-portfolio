      construction: 360-degree ring machined from an Inco 718 forging; plenum for fifth-stage cooling air
      arm: cylindrical arm with interference fit to the HPT casing, so the bolted flange grows radially on accel and keeps a positive seal
      decel_finding: the arm leaves the casing during part of the decel (support cools faster) and fifth-stage air leaks; a thermal shield was added
      wear: all surfaces mating with the HPT casing thermal-sprayed Triballoy 800
      icls_difference: 14 bosses for the probes
      stresses_at_takeoff:
