block_ii_rig_results:
  src: "sec 2.8 p.28; Figs.19-21"
  tests: {two_stage_group: "June 1981", five_stage_group: "September 1981"}
  two_stage:
    design_loading_dh_over_2u2: 1.70
    efficiency_at_design_loading: 0.891
    improvement_over_block_i_at_design_loading: 0.0075
    at_design_pt_over_ps: 2.0
    note: Block II also tolerates negative incidence better (larger gain at low loading)
  five_stage_design_point_efficiency: 0.920
  status_stackup:
    columns: [estimate_1980_ddr, rig_test_1981]
    eta_tt:                   [0.915, 0.920]
    delta_edge_blockage:      [0.0,   0.001]
    delta_purge_air:          [0.001, 0.001]
    delta_reynolds_number:    [-0.007, -0.007]
    eta_tt_at_m0_8_10_67km_max_climb: [0.909, 0.915]
  goals_at_max_climb: {icls: 0.911, fps: 0.917}
  status_at_max_climb: 0.914
  status_note: "sec 2.8 p.28 states 91.4 percent, exceeding the ICLS goal by 0.3; the stack-up column prints 91.5. Recorded as read."
  corrections_explained:
    edge_blockage: all Block II rotor blades arrived with trailing-edge diameters on average 25 percent oversized against design intent
    purge_air: extra power available from the inner-cavity purge entering the front stages and expanding through the rest; not simulated in the rig
    reynolds: five-stage rig excursion verified the 0.7 percent altitude penalty
  fig19_efficiency_vs_loading:
    src: "Fig.19 p.29 — two-stage LPT, read off"
    loading:  [1.1,   1.4,   1.65,  2.0,   2.5,   3.2]
