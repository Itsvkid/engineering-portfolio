blading_geometry:
  src: "Table III p.17 — turbine blading solidity and aspect ratio tabulations"
  rows:               [S1,    R1,    S2,    R2,    S3,    R3,    S4,    R4,    S5,    R5]
  axial_solidity_aw_over_t: [1.55, 1.33, 1.44, 1.26, 1.47, 1.24, 1.46, 1.23, 1.48, 1.30]
  zweifel_coefficient: [0.606, 1.094, 0.924, 1.069, 0.884, 1.065, 0.966, 1.079, 0.984, 1.023]
  te_blockage:        [0.043, 0.070, 0.058, 0.070, 0.055, 0.065, 0.054, 0.072, 0.045, 0.041]
  aspect_ratio_h_over_do: [5.96, 11.04, 10.51, 13.93, 12.13, 15.61, 14.51, 20.82, 13.87, 12.80]
  aspect_ratio_h_over_aw: [1.92, 4.02, 3.27, 5.02, 3.64, 5.74, 4.77, 8.62, 5.41, 6.36]
  symbol_note: >
    The second row is printed as a Greek-looking "t_z"; it is read as the
    Zweifel loading coefficient (psi_z), which is what a solidity table
    carries and whose 0.6-1.1 range these values sit in. h/d_o is height
    over throat; h/AW height over axial width.
  cross_check: >
    Rotor h/AW divided by Fig.52's chord-based aspect ratio is c/AW =
    1/cos(stagger): 1.14, 1.14, 1.15, 1.15, 1.11 for R1-R5, i.e. 26-30
    degrees of stagger, and the same ratio from AW/t x pitch x count
    gives the same answer on R1 and R5.

