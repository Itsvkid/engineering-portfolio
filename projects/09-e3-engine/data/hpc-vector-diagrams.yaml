# Lines whose printed values fail a check, or could not be read cleanly.
# Transcribed as read, allowed by name in the tests, never "corrected".
#   check: chain      exit pt/tt of this row vs inlet of the next in the gas
#                     path; `physical: true` when the report explains it
#   check: illegible  the printed digits could not be read; `stated` is what
#                     the surrounding data implies, with its uncertainty
inconsistent_as_printed:
  - {row: "rotor 3", block: exit, sl: 1, check: chain, physical: false,
     read: "rotor 3 exit PT/PT1 3.9301; stator 3 inlet PT/PT1 3.9240 on the next page; TT identical",
     note: "0.006 apart where the other eleven streamlines agree to 0.0001 and no loss is booked between a rotor exit and its stator inlet. One of the two is a misprint or a misread; 3.9301 could be 3.9241. Not corrected."}
  - {row: "stator 5", block: exit, sl: 1, check: chain, physical: true,
     read: "stator 5 exit PT/PT1 7.4883, TT/TT1 2.0011; rotor 6 inlet PT/PT1 7.4947, TT/TT1 1.9883. Streamlines 2-12 identical",
     note: "Both PT and TT change on the tip streamline only. CR-168219 sec 5.2.1 p.52 and the HPC report put the customer-bleed and clearance-control ports at the STATOR 5 EXIT casing: the outermost stream tube leaves the compressor there and the tip streamline is redefined on the next page. Physical, not a misprint."}
  - {row: "stator 7", block: exit, sl: 1, check: chain, physical: true,
     read: "stator 7 exit PT/PT1 12.4023, TT/TT1 2.3285; rotor 8 inlet PT/PT1 12.4159, TT/TT1 2.3036. Streamlines 2-12 identical",
     note: "The same signature as stator 5: tip streamline only, PT and TT both change. CR-168219 sec 5.2.1 p.52: casing ports for HPT cooling air at the STAGE 7 EXIT. The second bleed port, found in the data where the prose puts it. Physical."}
  - {row: "stator 9", block: sl_data, sl: 2, check: r_bar,
     read: "R-BAR 29.444 here; Table XXII section 2 prints 29.449 cm beside 11.592 in",
     note: "Resolves the XXII allowance: 11.592 in x 2.54 = 29.444, and this page prints 29.444 independently. XXII's 29.449 is the misprint. Neither file is edited; both notes say so."}
  # Printed solidity above chord x N / (2 pi r) -- only at the hub end of
  # three rows, only one-signed, and in every case the chord that reproduces
  # the printed solidity is the UNTRIMMED one: rotor 1 implies 10.282 cm at
  # both hub lines, its mid-span chord, while the plane sections show the
  # hub cut back to 10.17 and 10.11. The report computed solidity before
  # the hub sections were trimmed and did not recompute. 245 of 252 lines
  # agree within 0.5 %.
  - {row: igv,       block: sl_data, sl: 10, check: solidity, read: "1.0859 vs 1.0788 from chord 4.5938; implied chord 4.6240"}
  - {row: igv,       block: sl_data, sl: 11, check: solidity, read: "1.1595 vs 1.1468 from chord 4.2771; implied chord 4.3243"}
  - {row: igv,       block: sl_data, sl: 12, check: solidity, read: "1.2126 vs 1.2001 from chord 4.0793; implied chord 4.1219"}
  - {row: "rotor 1", block: sl_data, sl: 11, check: solidity, read: "2.2606 vs 2.2367 from chord 10.1732; implied chord 10.2820 = the mid-span chord"}
  - {row: "rotor 1", block: sl_data, sl: 12, check: solidity, read: "2.4029 vs 2.3618 from chord 10.1062; implied chord 10.2822 = the mid-span chord"}
  - {row: "rotor 3", block: sl_data, sl: 11, check: solidity, read: "1.5261 vs 1.5116 from chord 4.8637; implied chord 4.9104, continuing the SL10 trend"}
  - {row: "rotor 3", block: sl_data, sl: 12, check: solidity, read: "1.5470 vs 1.5128 from chord 4.7821; implied chord 4.8902, continuing the SL10 trend"}
  - {row: "rotor 3", block: sl_data, sl: 1, check: illegible, column: inc_deg, stated: 1.50,
     note: "Second digit faint: 1.50 or 1.90. 1.50 continues the tip-to-hub trend (1.50, 1.70, 2.10, 2.50 ...). Incidence enters no check."}
  - {row: "rotor 4", block: sl_data, sl: 5, check: illegible, column: df, stated: 0.4443,
     note: "Last two digits faint. Recomputed from the printed velocities, angles and solidity: 0.444; neighbours 0.4413 and 0.4473. Stated to +-0.002."}
  - {row: "rotor 5", block: inlet, sl: 12, check: illegible, column: cz_m_s, stated: 189.5,
     note: "Printed CZ unreadable. Solved from the printed DF 0.6411, exit CZ 144.4, inlet and exit BETA and solidity: 189.5. Neighbouring streamline 194.2. Stated to +-2."}
  - {row: "stator 5", block: sl_data, sl: 1, check: illegible, column: dev_deg, stated: 12.81,
     note: "Leading digits faint: 1?.81, next line 11.76. Stated 12.81. Deviation enters no check."}
  - {row: "rotor 6", block: inlet, sl: 9, check: illegible, column: beta_deg, stated: 56.85,
     note: "Last digit faint: 56.8?. Neighbours 57.60 and 56.03. Stated 56.85 +-0.05; the DF check tolerates it."}

# How the blading moved between the ORIGINAL design (Table XXI, pp.112-132)
# and the FINAL design (Tables X and XXII). Found by the solidity and chord
# checks; pinned by the tests so a transcription slip in either file shows.
design_change_original_to_final:
  blade_counts:
    rotor_9:  {original: 88, final: 86}
    rotor_10: {original: 98, final: 94}
    note: >
      Every other row keeps its count. Both are established two ways: the
      Table XXI page header, and solidity x 2 pi R-BAR / chord on all twelve
      streamlines, which returns 88.0 and 98.0 exactly. Tables X and XXII
      say 86 and 94. The final design took two blades out of rotor 9 and
      four out of rotor 10.
  chords:
    rotor_3:  {change: "-3.6 % at every section"}
    rotor_4:  {change: "-2.6 % at the hub section only (SL 12: 3.9189 -> 3.8165); all other sections within 0.3 %. The original value is the one Table X still prints as chord_root."}
    stator_8: {change: "up to +7.6 % mid-span (SL 7-8); tip and hub within 2 %"}
    stator_9: {change: "up to +5.4 % mid-span (SL 8); tip and hub within 3 %"}
    note: "All other rows within 1 %. Stators 8 and 9 were re-chorded mid-span; rotor 3 was shortened uniformly; rotor 4 at the hub."
  hub_solidity:
    rows: [igv, "rotor 1", "rotor 3"]
    streamlines: "10-12 (IGV), 11-12 (rotors 1 and 3)"
    note: >
      Seven blade-element lines print a solidity above chord x N / (2 pi r),
      all at the hub end, all one-signed, and in every case the chord that
      reproduces the printed solidity is the untrimmed one -- rotor 1's
      implied hub chord is its mid-span chord to four figures. The solidity
      column was computed before the hub sections were trimmed and was not
      recomputed. Listed line by line in inconsistent_as_printed. The other
      245 lines agree within 0.5 %.
