# E3 High Pressure Compressor — vector diagrams and blade-element data,
# every row, twelve streamlines each.
#
# SOURCE: "Energy Efficient Engine High Pressure Compressor Detail Design
# Report", General Electric for NASA Lewis, NAS3-20643, NTRS 19850002690.
# Table XXI, "Vector Diagram and Airfoil Geometry Data for Original-Design
# Blading (SI Units)", pp.112-132 (PDF 121-141), one page per row. The
# US-units repeat on pp.133-153 is not transcribed. US Government work,
# public use permitted.
#
# This is the THROUGH-FLOW data: what the CAFD program computed on twelve
# axisymmetric stream surfaces at the leading edge and trailing edge of
# every blade row, plus the blade-element quantities at the stacking-axis
# radius. It is the Stage C2 target -- the radial distributions a radial-
# equilibrium calculation must reproduce.
#
# Print order is NOT gas-path order (p.116 is rotor 3; stators 2 and 3
# follow on pp.117-118). Rows here are in print order with their page;
# tests build the gas-path order from (row, stage).
#
#   inlet / exit   sl, pct_imm, radius_cm, z_cm, pt_ratio, tt_ratio, m_abs,
#                  [m_rel, u_m_s -- rotors only], cz_m_s,
#                  angle_deg (BETA, relative, rotors; ALPHA, absolute,
#                  stators), phi_deg (streamline slope)
#   sl_data        sl, pct_imm, r_bar_cm, solidity, df, loss,
#                  [cum_eff, inc_deg, dev_deg -- not on the IGV]
#   chord_original_cm   the chord column of the page's plane-section block:
#                  the ORIGINAL-design chord at each streamline. Kept
#                  because solidity was computed from it; the rest of that
#                  block is superseded by Table XXII (final design).
#
# pt_ratio and tt_ratio are referred to the compressor inlet total state.
#
# Read off a 1985 scan. Held to itself and to the other tables by
# tests/test_hpc_vector_diagrams.py:
#   r_bar equals Table XXII's section radius, streamline by streamline;
#   u / radius is one angular velocity on every rotor streamline, and it
#     is the HP spool speed the published data file carries;
#   exit pt/tt of a row chains into inlet pt/tt of the next row in the
#     gas path -- except where a bleed removes the tip stream tube;
#   solidity equals chord_original x blade count / (2 pi r_bar);
#   diffusion factor recomputes from the printed velocities and angles.
#
# Sign of PHI on faint lines was set from the spanwise trend (tip
# negative, hub positive, monotonic). PHI enters no check.

