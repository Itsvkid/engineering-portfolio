    mod_v: {main_ignition: staging at 50 percent, pattern_factor_40_60: 0.50, profile: inward peaked well beyond the limit, conclusion: removing primary-zone air from the main stage for ignition is bad for exit temperature in a combustor this short; a rich main dome with acceptable ignition and EGT would need substantial further development}
