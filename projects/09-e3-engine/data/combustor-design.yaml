    split_40_60: {uncoated_cold: [769, 1045, 1084], uncoated_hot: [1057, 1112, 1157], tbc_cold: [942, 976, 1002]}
    split_30_70: {uncoated_cold: [1035, 1086, 1129], uncoated_hot: [1100, 1160, 1215], tbc_cold: [965, 1002, 1033]}
    as_printed: "the 40-60 main-side x = 0.4 cold surface prints 769 K beside a hot surface of 1057 and the F figure's 1344 F (1002 K). A dropped hundred: 969. Recorded."
  tip_surface_K:
    src: "Fig.62b p.102"
    pilot_side: {x_0_4: {split_50_50: [1088, 1043], split_40_60: [1068, 1023], split_30_70: [1053, 1007]}, x_0_8: {split_50_50: [1142, 1094], split_40_60: [1127, 1077], split_30_70: [1117, 1064]}}
    main_side:  {x_0_4: {split_50_50: [1090, 1036], split_40_60: [1113, 1047], split_30_70: [1138, 1062]}, x_0_8: {split_50_50: [1069, 1103], split_40_60: [1204, 1124], split_30_70: [1239, 1146]}}
    columns: [uncoated, tbc]
    as_printed: "main side x = 0.8, 50-50 prints uncoated 1069 below its coated 1103 (the F figure has 1465 / 1526 the same way) -- the one cell where the coating reads hotter"
  tip_distribution:
