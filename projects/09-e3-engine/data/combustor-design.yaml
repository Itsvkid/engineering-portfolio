  finding: the main-dome side runs hotter than the pilot side and gets hotter as the main dome takes more fuel; the 0.051 cm thermal barrier coating takes 40-90 K off the cold surface

fuel_nozzle_thermal:
  src: "sec 5.4.1.4 pp.104-105; Fig.64"
