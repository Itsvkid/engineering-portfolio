stress_and_life:
  src: "sec 5.4.2 pp.106-123; Figs.65-78; Table XIX"
  mission_mix:
    src: "Fig.65 p.107 — recommended mission mix; percent of flights vs change in engine inlet temperature"
    cold_day: {pct: 30, dt2_K: [-30, -5]}
    standard_day: {pct: 20, dt2_K: [-5, 3]}
    tropical_day: {pct: 30, dt2_K: [3, 15]}
    hot_day: {pct: 20, dt2_K: [15, 35]}
    life_basis: constant hot-day +15 K (27 F) operation -- conservative; the tropical (+15 K) day limits life over the +35 K day because its metal gradients are higher
  shingle:
    model: MASS finite elements, half a shingle by symmetry, curved plates and beams on the actual casting; pressure, mechanical and thermal loads
    pressure_stress:
      src: "Fig.67 p.110 — maximum anticipated liner pressure drop x 1.5 for surge"
      safety_factor: 1.5
      max_panel_MPa: 125
      end_foot_bending_MPa: 148
      end_foot_bending_ksi: 21.5
      location: support foot -- rupture-limited region
    rupture:
      src: "Fig.68 p.111 — hot-day growth takeoff, 1.5 x shingle dP, avg -3 sigma"
      e3_design: {kt: 1.7, w_over_s: 0.95, rupture_life_h: 1300}
      goal_h: 300
      note: "life rises steeply with foot-to-slot width ratio: Kt 1.5 gives 300 h at W/S 0.45 and 8,000 at 1.35; Kt 2.0 gives 300 h at W/S 1.1"
    lcf:
      src: "Figs.69-71 pp.112-114 — hot-day growth takeoff; hot streak 100 K (180 R) above the mean, a narrow axial band at the quarter-shingle position; MPa"
      hot_streak_dt_K: 100
      stress_peaks_MPa: [225, 225]
      hot_streak_temperature_peak_K: 1260
      life_limited_region: aft support foot
      e3_design_cycles_with_hold_time: 20000
      goal_cycles: 9000
      w_over_s: 1.0
      no_hold_time_cycles: 100000
      note: life falls steeply with W/S (opening the slot admits more coolant) but rupture needs the foot -- the 1.0 ratio is the compromise
    predicted_life:
      src: "Table XIX p.115"
      goal: {lcf_cycles: 9000, rupture_h: 300}
      baseline_x40: {t_max_K: 1111, t_max_F: 1540, lcf_cycles_as_printed: 105, lcf_cycles_taken: 100000, rupture_h: 5000}
      growth_mar_m_509: {t_max_K: 1283, t_max_F: 1850, lcf_cycles: 26000, rupture_h: 1000}
      as_printed: "the baseline LCF prints '105' -- a superscript lost in typesetting, 10^5. Taken as 100,000; Fig.71's no-hold-time curve is there."
      note: the growth combustor needs Mar-M-509 shingles for the cyclic life at 1283 K
  support_liners:
    src: "sec 5.4.2.2 pp.115-121; Figs.72-76"
    tools: CLASS-MASS for stress; BOSOR for buckling
    material: Inconel 625
    condition: {p3_MPa: 3.834, p3_psia: 556, t3_K: 914, t3_F: 1185}
    yield_0_02pct_at_922K_MPa: 275
    yield_0_02pct_at_922K_ksi: 40
    outer_liner_stress_MPa: {front_peak: 245, first_hook: 100, mid: 30, aft: 145}
    inner_liner_stress_MPa: {front_peak: 190, mid_peak: 125, aft_hooks: [95, 115], aft: 170}
    buckling:
      src: "Fig.74 p.119; Fig.75 p.120; Fig.76 p.121"
      dp_MPa: 0.193
      dp_psia: 28
      line_loads_N_cm: [35.4, 35.7, 18.7]
      line_loads_lb_in: [20.2, 20.4, 10.7]
      p3_MPa: 3.91
      p3_psia: 567
      thickness_range_mm: [0.76, 1.27]
      thickness_range_in: [0.03, 0.05]
      round_shell_1_02mm: {min_critical_MPa: 1.24, min_critical_psi: 180, nodes: 9, fixity: dome only; 1.37 MPa at N = 10 fixed at both ends}
      out_of_round_design: {radial_out_of_round_cm: 0.025, min_yielding_pressure_MPa: 0.42, full_dp_MPa: 0.193, margin: 2.2}
      chosen_margin: 2x at maximum growth
      as_printed:
        - "Fig.74 prints T3 = '94 K (1185 F)' for 914 K, and the liner thickness as '0.26-1.27 mm (0.03-0.05 in)' where 0.03 in is 0.76 mm"
        - "the text gives the thickness range as '0.76 to 1.27 mm (0.038 to 0.050 inch)'; 0.76 mm is 0.030 in"
        - "Fig.75 prints T = 1.02 mm (0.40 in) for 0.040 in"
  casing:
    src: "sec 5.4.2.3 p.116; Fig.77 p.122"
    tool: CLASS-MASS at growth maximum pressure; temperature near uniform and a little below compressor discharge
    thickness_criterion: maximum stress at 50 percent of the material yield
    conditions: {p3_MPa: 3.91, p3_psia: 567, t3_K: 914, t3_F: 1185, pressure_load_MPa: 3.72, pressure_load_psi: 540, t_case_K: 867, t_case_F: 1100}
    axial_loads_kN: {forward_flange: 249.1, mid: 31.1, aft_flange: 222.4}
    axial_loads_lb: {forward_flange: 56000, mid: 7000, aft_flange: 50000}
    fifty_pct_yield_avg_minus_3sigma_MPa: 360
    fifty_pct_yield_ksi: 52
    stress_read_off_MPa: {forward_peak: 335, forward_trough: 55, aft_plateau: 410, aft_end: 135}
    nominal_thickness_in: 0.15
    as_read: the aft plateau at about 410 MPa sits above the 360 MPa 50-percent-yield line the figure draws as the design intent; recorded as read
  centerbody_life:
    src: "sec 5.4.2.4 pp.116-123; Fig.78 — baseline standard-day takeoff, avg -3 sigma Hastelloy X; cycles vs main-dome fuel fraction; read off"
    main_dome_fuel_pct: [50, 60, 70]
    baseline:               [100, 200, 100]
    with_thermal_barrier:   [200, 600, 240]
    with_tip_slots:         [3300, 1800, 700]
    with_slots_and_barrier: [400000, 90000, 7000]
    goal_cycles: 9000
    finding: only the slotted, coated tip reaches the goal, and only up to about 69 percent main-dome fuel -- the slots buy 15-30x, the coating 2-3x, together 100-2000x

fuel_nozzle_vibration:
  src: "sec 5.4.3 pp.124-135; Figs.79-87; Table XX"
  original_goal_min_Hz: 1000
  method: MASS finite elements, the stem as constant-area beams with the fuel passages and insulation removed from the section
  cf6_lessons: [forged construction, maximum blend radii between stem and flange, metering valve isolated from the stem]
  candidates_Hz: [750, 1000]
  temperature_effect: frequency falls with speed as Young's modulus falls with temperature -- 816 Hz at room temperature for 750 at takeoff
  campbell:
    src: "Fig.82 p.128 — read off"
    current_design_Hz: {at_0: 810, at_takeoff: 750}
    stiffened_Hz: {at_0: 1080, at_takeoff: 1000}
    takeoff_rpm: {baseline: 12900, growth: 13300}
    per_rev_lines: [1, 2, 3, 4, 5, 6, 7, 8]
  chosen_Hz: 750
  why_not_1000: about 50 percent more stem blockage in the outer passage that carries turbine cooling air (Figs.83-85), and too large to pass through the casing port between the diffuser and the cowls with the combustor in place (Fig.86)
  comparison:
    src: "Table XX p.129 — first-flex natural frequencies"
    design: [CF6-50_ruggedized, CFM56_F101, E3]
    first_flex_Hz: [900, 500, 750]
    per_rev_at_takeoff: [5.5, 2, 3.5]
    note: 750 Hz at 3.5/rev is a 12,860 rpm takeoff -- the baseline line of Fig.82
  bench_test: nozzle on a rigid plate simulating the casing, to confirm the stem frequency (Fig.87)

development_testing:
  src: "sec 6 pp.136-414 -- summary tables LVII-LXII pp.410-415 and the Mod VI exit-temperature test pp.388-393"
  configurations:
    src: "Table LVII p.410 — full-annular combustor configurations"
    mod_i: {pilot: [swirl cup flow reduced, cooling reduced], main: increased swirl cup flow, centerbody: reduced pilot dilution, outer_liner: [increased primary dilution, trim dilution, ring 1 cooling], inner_liner: [increased trim dilution, ring 1 cooling]}
    mod_ii: {pilot: reduced swirl cup flow, main: reduced swirl cup flow, centerbody: [increased pilot and main dilution, increased cooling, shortened], outer_liner: [increased primary dilution, reduced ring 1 cooling], inner_liner: [increased primary dilution, added panel 2 dilution]}
    mod_iii: {pilot: dome cooling reduced, main: [swirl cup flow reduced, dome cooling reduced], centerbody: extended crossfire tube, outer_liner: aft dilution increased, inner_liner: [aft dilution increased, panel 2 dilution eliminated]}
    mod_iv: {inner_liner: [aft dilution reduced, panel 2 dilution added]}
    mod_v: {centerbody: reduced primary dilution thimble, outer_liner: added panel 2 dilution, inner_liner: reduced primary dilution thimble}
    mod_vi: {main: swirl cup flow increased, centerbody: original crossfire tube, outer_liner: [panel 2 removed, aft dilution reduced], inner_liner: aft dilution reduced}
    mod_vii: {inner_liner: panel 2 dilution increased}
    arc: baseline and Mod I lean main dome; Mods II-V the rich-main-dome detour; Mods VI-VII back to the lean dome
  results:
    src: "Table LVIII pp.411-412"
    baseline: {pilot_ignition: marginal, main_ignition: poor at subidle, pattern_factor: {at_40_60: 0.41, at_50_50: 0.26}, epap: {co: 8.20, hc: 3.03, nox: 2.78}}
    mod_i: {pilot_ignition: significantly improved -- goal with margin, main_ignition: not as good as baseline, pattern_factor_40_60: 0.24, profile: beyond limit in the hub, epap: {co: 4.55, hc: 0.47, nox: 2.81}}
    mod_ii_a: {pilot_ignition: not as good as Mod I but acceptable, comment: inner panel-2 dilution and centerbody cooling currents stop the pilot flame entering the main annulus through the crossfire tubes}
    mod_iii_a: {main_ignition: staging possible down to 45 percent core speed at true inlet pressures, comment: crossfire tube needs moving forward}
    mod_iii_b: {main_ignition: staging at 40 percent with little or no bleed, pattern_factor_40_60: 0.45, comment: too much inner trim dilution for the mixing length}
