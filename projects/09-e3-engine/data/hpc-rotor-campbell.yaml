meta:
  src: "HPC detail-design report Figures 33-42, pp.67-76 -- 'Compressor Rotor Stage N Blade Campbell Diagram', one per rotor stage"
  transcribed: 2026-09-08
  how: >
    Read off the page images. These ten diagrams were recorded in
    hpc-mechanical.yaml as "remain figure-status (A3)" and were the sole
    gate on Stage E3's closure. They are legible. Frequencies are read at
    the zero-speed intercept of each labelled mode line, in kHz as the
    axis prints them, and converted to Hz here.
  reading_uncertainty: >
    The mode lines are drawn as thin horizontal curves against a 0-6, 0-12,
    0-22 or 0-26 kHz axis depending on the stage. Reading precision is
    about half a minor division: +-0.05 kHz on the 0-6 axis, +-0.1 on
    0-12, +-0.25 on 0-22 and 0-26. That is 2-14 % on a first-flex
    frequency and is stated because it is comparable to the closure band.
  speed_dependence: >
    The lines are drawn flat or gently drooping across the whole speed
    range, not rising. On stages 7-10 they visibly droop. Recorded as read;
    see unit E3's finding on what that means against centrifugal
    stiffening.
  rig_note: "the diagrams carry: RIG BLADE MATL. IS Ti 6-4, CORE BLADE MATL. WILL BE Ti 8-1-1"
  observed_points: "circles are 1-6 rig test, squares 1-10 (or 1-10A) rig test"

