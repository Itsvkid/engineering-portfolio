  segments: 24
  intersegment_seals: one axial hour-glass seal and one spline seal per gap

# ── rotor structure ──────────────────────────────────────────────────────
rotor_structure_thermal:
  src: "CR-167955 sec 3.2.7 pp.59-65; Fig.37 p.63; Fig.38 p.64"
  designed_for: growth engine, 15-20 percent higher thrust — higher T3, T41, pressure and speed; the growth case was limiting throughout
  model:
    extent: aft end of the compressor to the LPT bearing, including the LPT shaft
    nodes: 908
    materials: 8
    boundary_condition_tables: 183
    time_inputs: 44
    transient: complete mission from cold start through flight and shutdown (Fig.11 mission)
  components_in_model: [CDP seal, torque-shaft cover, HPT torque shaft, LPT main shaft, impeller disk, inducer seal, stage 1 disk, interstage seal disk, stage 2 disk, turbine aft seal disk, stub shaft]
  problem_areas:
    - compressor-discharge seal disk bolt flange
    - inducer seal disk bolt flange
    - impeller disk bore and rabbet
    - stage 1 disk bore
    - interstage-seal disk bolt circle and seal teeth (temperature-limited; all others were transient-gradient problems)
    - stage 2 disk bore
    - aft-seal disk bolt circle
  interstage_seal_disk_fix:
    problem: massive bolts, flange and disk lag the thin outer seal ring after an accel — severe thermal stress at the bolt circle
    fix: slots machined in the bolt flanges; a small flow heats the flange convectively from both sides
    flange_temperature_gain_C: 56
    flows_pct_w25: {to_each_side: 0.1, supply: 0.8}
    src_fig: "Fig.38 p.64 — radial temperature profile with and without flange cooling, 200-700 C"
  stage2_disk_bore_fix:
    problem: axial plus radial transient thermal stresses limited transient rupture life at the bore
    fix: more heat transfer to the bore, so the bore surface warms faster and its thermal compressive stress offsets the mechanical tensile stress
    flow_under_disk_pct_w25: 0.2
    radial_gap_cm: {before: 0.254, after: 0.127}
    radial_gap_in: {before: 0.10, after: 0.05}

