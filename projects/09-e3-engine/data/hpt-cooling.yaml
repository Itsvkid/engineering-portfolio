      forward_slot: {pct: 0.32, size_mm: [0.635, 3.02], size_in: [0.025, 0.119]}
      aft_slot:     {pct: 0.38, size_mm: [0.635, 3.66], size_in: [0.025, 0.144]}
    total_pct: 0.76
    note: "closes twice: 0.35 + 0.41 = 0.76 and 0.03 + 0.03 + 0.32 + 0.38 = 0.76"
  metal_temperatures:
    src: "Fig.35 p.58 — pitch line, steady-state takeoff; printed in C and F"
    conditions: {t_tb_C: 1038, t_tb_F: 1900, t_cdt_C: 594, t_cdt_F: 1102, t_cp_C: 628, t_cp_F: 1163, w_c_pct_w25: 0.76, t_bulk_C: 929, t_bulk_F: 1705}
