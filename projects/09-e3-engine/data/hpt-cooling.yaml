# ── flight mission ───────────────────────────────────────────────────────
flight_mission:
  src: "CR-167955 sec 3.1.4 p.25; Fig.12 p.26"
  description: 2-hour flight typical of a domestic commuter airline, one start-stop cycle
  segments_minutes:
    - {setting: cutoff_to_start, minutes: 0.5}
    - {setting: ground_idle, minutes: 5}
    - {setting: taxi, minutes: 4}
    - {setting: ground_idle, minutes: 1}
    - {setting: takeoff, minutes: 2}
    - {setting: max_climb, minutes: 22}
    - {setting: max_cruise, minutes: 48}
    - {setting: flight_idle, minutes: 11.5}
    - {setting: loiter, minutes: 5}
    - {setting: approach_45pct_takeoff, minutes: 7.5}
    - {setting: thrust_reverse, seconds: 5}
    - {setting: taxi, minutes: 5}
    - {setting: ground_idle, minutes: 1}
  day_conditions_evaluated_C: {hot: 50, flat_rating_corner: 30, standard: 15, cold: -2}
  note: >
    Each component has its own worst mission: start/shutdown for the rotor
    structure; idle, takeoff and thrust-reverse for blades and vanes. Above
    the 30 C corner point thrust is held by a constant rotor-inlet
    temperature of 1343 C at lower pressure.
