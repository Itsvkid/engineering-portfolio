# ── stage 2 nozzle ───────────────────────────────────────────────────────
stage2_nozzle:
  src: "CR-167955 sec 3.2.4 pp.49-54; Figs.31-33 pp.52-56"
  vane_count: 48
  supply:
    source: compressor stage-7 stator exit
    extraction_port: shared with the engine-start bleed port, which is sized for 30 percent of core flow to the fan duct — so the stage-7 bleed causes no pressure-loss problem at the compressor
    routing: four pipes into eight HPT casing inlet ports at the stage-2 stator; circumferential distribution to the whole nozzle
  scheme:
    type: convection with a single impingement insert; pressure-side trailing-edge bleed slots
    impingement_hole_diameter_mm: 0.51
    impingement_hole_diameter_in: 0.020
    impingement_spacing_diameters: [4, 12]
    no_leading_edge_film_holes: true
    features: [low-leakage insert/vane, low-pressure-drop spoolie, preferential impingement cooling, preferential trailing-edge circuit, cooled band leading edge, interstage-seal purge, positive coolant backflow margin]
  flows_pct_w25:
    src: "sec 3.2.4 p.49; Fig.32 p.53"
    stage7_total: 2.35
    shroud_purge: 0.35
    purge_leakage: 0.15
    vane_cooling: 1.85
    vane_exit_trailing_edge_slots: 1.10
    vane_exit_interstage_seal_purge: 0.75
    band_leakages: [0.05, 0.05]
    seal_purge_total: 0.5
    note: >
      Closes two ways: 1.85 + 0.35 + 0.15 = 2.35 = Table VII's stage-7
      streams (2.0 + 0.35); and 1.10 + 0.75 = 1.85. Fig.33's caption
      prints the vane total as 1.35 % -- see as_printed_inconsistency.
  as_printed_inconsistencies:
    - note: "Fig.33 caption: 'Total Stage 2 Vane Cooling Flow = 1.35 % W25; 1.10 % exits at the trailing edge; 0.75 % as interstage-seal purge'. 1.10 + 0.75 = 1.85, which is what sec 3.2.4 and Fig.32 say. The 1.35 is a misprint."
    - note: "sec 3.2.4 p.54: bulk metal temperatures 'at the 65 % and 95 % span are 928 C and 972 C, respectively'. Fig.33's 95 %-span panel prints T_bulk = 928 C, and the node averages agree with the figure (95 %: ~930 C; 65 %: ~975 C). The prose has the two spans reversed."
