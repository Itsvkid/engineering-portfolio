# ── stage 2 rotor ────────────────────────────────────────────────────────
stage2_rotor:
  src: "CR-167955 sec 3.2.5 p.54; Figs.34-36"
  blade_count: 70
  supply:
    source: compressor discharge via the stage-1 expander nozzle system
    path: down the front of the stage-1 disc, under it, up the front of the stage-2 disc, into the dovetail slot from the front
    t_coolant_supply_C: 593
    t_coolant_supply_F: 1099
  scheme:
    type: two-circuit internal convection, no film
    forward_circuit: {passes: 3, note: "fresh air through a small area near the leading edge; 2-D rib turbulators; exit through a pressure-side midchord slot near the tip, high-velocity to energise the mainstream"}
    aft_circuit: {note: "small serpentine near the trailing edge first, then two further passages; rib turbulators; exit through a single pressure-side slot near the tip"}
  flow_pct_w25: 0.76
  temperatures:
    src: "sec 3.2.5 p.54"
    gas_pitch_line_C: 1038
    gas_pitch_line_F: 1900
    bulk_C: 929
    bulk_F: 1705
    coating_max_C: 1013
    coating_max_F: 1855
    coating_max_location: trailing edge — the hardest part to cool, high heat-transfer coefficient and far from the last radial passage
    fix: trailing-edge wedge angle increased so the last radial cavity sits closer to the trailing edge; no trailing-edge slot cooling needed
  cooling_system:
    src: "Fig.34 p.57 — flows in % W25"
    material: cast Rene 150
    coating: PVD
    features: [serpentine convection cooling, no film cooling or trailing-edge holes, tip pressure-side ejection for exit and torque, turbulence promoters on ribs and walls]
    circuits_in: {forward_pct: 0.35, aft_pct: 0.41}
    exits:
