# E3 High Pressure Compressor — airfoil section geometry, every row.
#
# SOURCE: "Energy Efficient Engine High Pressure Compressor Detail Design
# Report", General Electric for NASA Lewis, NAS3-20643, NTRS 19850002690.
# Table XXII, "Airfoil Geometry Data for Final-Design Blading", pp.154-159
# (PDF pages 163-168). US Government work, public use permitted.
#
# This is the blade-angle data. Twelve plane sections per row, hub to tip
# (the table prints tip first; kept in that order). Rotors 1-10 and the IGV
# plus stators 1-10. Each section, as printed:
#
#   sect_ht_cm  sect_ht_in   section radius ("section height") from the axis
#   chord_cm    chord_in
#   camber      degrees, metal turning, beta1* - beta2*
#   stagger     degrees, chord line to axial
#   beta1       beta1*, inlet metal angle, degrees
#   beta2       beta2*, exit metal angle, degrees
#   tm_c        max thickness / chord
#   pct_c_tm    chordwise position of max thickness, % chord
#   tte_c       trailing-edge thickness / chord
#
# The IGV has no camber or beta columns; it prints stagger and a lift
# coefficient CL0 instead. Its column list differs and says so.
#
# Transcribed from a 1985 scan by eye. EVERY row was checked two ways while
# transcribing and is checked again by tests/test_hpc_sections.py:
#   camber == beta1 - beta2 (to print rounding), and
#   cm == in x 2.54 for section radius and chord.
# Rows where the printed values do not satisfy those checks are listed in
# `inconsistent_as_printed` with what was read. They are transcribed as read,
# not "corrected".

meta:
  report: E3 HPC Detail Design Report, NTRS 19850002690
  table: XXII
  pages_printed: [154, 155, 156, 157, 158, 159]
  pages_pdf: [163, 164, 165, 166, 167, 168]
  transcribed: 2026-09-04
  angle_units: degrees
  length_units: cm, with the printed inch value alongside
  section_order: tip first, hub last, as printed

columns: [sect_ht_cm, sect_ht_in, chord_cm, chord_in, camber, stagger, beta1, beta2, tm_c, pct_c_tm, tte_c]

