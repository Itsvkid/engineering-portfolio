# ─────────────────────────────────────────────────────────────────────────
# NOT IN R&M 2974. The aspect-ratio dependence of the secondary loss that
# Dunham and Came added in 1970. Their paper is not on disk; the form is
# as recalled from the published paper and from Dixon & Hall's textbook
# account of it, and is labelled an assumption until the paper is fetched.
# ─────────────────────────────────────────────────────────────────────────
dunham_came_1970:
  src: assumption
  reference: "J. Dunham and P. M. Came, 'Improvements to the Ainley-Mathieson method of turbine performance prediction', ASME J. Eng. Power 92 (1970) 252-256 — not on disk"
  secondary: "Y_s = 0.0334 (c/h) (cos a2 / cos b1) [C_L/(s/c)]^2 [cos^2 a2 / cos^3 a_m] — replaces lambda with a chord-to-height term"
  clearance: "Y_k = B (c/h) (k/c)^0.78 [C_L/(s/c)]^2 [cos^2 a2 / cos^3 a_m], B = 0.47 unshrouded, 0.37 shrouded"
  constants: {secondary: 0.0334, B_unshrouded: 0.47, B_shrouded: 0.37, clearance_exponent: 0.78}
  note: >
    The E3 LPT rows have h/c of 2.6 (S1) to 8 (R4); the R&M 2974 data
    behind Fig 8 came from turbines of h/c about 1 to 3, and Fig 8 has no
    height term. Used here as a second route, reported beside the pure
    R&M 2974 result, never in its place.
