meta:
  src: "NASA TP-1337 Appendix C, 'BLADE MANUFACTURING COORDINATES FOR ROTOR 37', pdf pages 54-57 (printed 44-47)"
  transcribed: 2026-09-07
  how: >
    Read off the page images directly. The document is a 1978 scan and its
    OCR is badly corrupted in this appendix -- pdftotext returns "0 .Otis"
    and "0 .$073" for numbers, "LESS)" for "L(sp)", "GAHHA"/"¢AHHA" for
    GAMMA and "DES"/"DEC" for DEG -- so no text extraction was used. Every
    figure below was read from the rendered page. The pages themselves
    carry NASA's "ORIGINAL PAGE IS OF POOR QUALITY" stamp.
  nomenclature: >
    Per the appendix's own diagram. L runs along the blade section's
    reference (chord) line from the leading edge. HP and HS are the
    heights of the pressure and suction surfaces above that line at each L.
    R1 and R2 are the leading- and trailing-edge radii, and the section
    closes with HP = HS = R1 at L = 0 and HP = HS = R2 at L = L_max.
    L(sp), H(sp) locate the stacking point on the section; GAMMA is the
    stagger, printed as degrees and minutes. Everything is in INCHES,
    because, as the appendix says, "at present all tooling used for blade
    fabrication by American companies utilizes the U.S. customary system".
  uncertain_digits:
    - where: "rad 7.2000, GAMMA"
      printed_as: "3? DEG 30 MIN -- the tens digit did not resolve"
      taken: 38
      why: >
        Between the neighbours 36 deg 32 min at 7.0000 and 41 deg 25 min at
        7.4800, so the tens digit can only be 3. Recorded rather than
        silently read; the smoothness check in tools/check_rotor37_coords.py
        tests it against the other eleven.
    - where: "rad 9.9330, GAMMA"
      printed_as: "6? DEG 23 MIN -- reads as 65, but 63 would fit the trend"
      taken: 65
      why: >
        Taken AS READ, at 65. The trend through 57 deg 26 min (9.2500) and
        60 deg 21 min (9.6100) would suggest about 63, and the jump to 65 is
        larger than the one before it. This project does not correct printed
        source data, so 65 stands and the discrepancy is recorded here. It
        matters only for the tip section's own stagger and is flagged in the
        smoothness check as a known outlier.
  not_transcribed: >
    Rotor 37's stator (pages 58-61) and rotors/stators 35, 36 and 38. Only
    rotor 37 is needed for the C4 validation case.

units: inches
