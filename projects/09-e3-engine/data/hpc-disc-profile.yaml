meta:
  source: HPC detail design report, Figure 30 p.59 (PDF page 68), Rotor Design Features
  method: tools/read_hpc_fig30.py
  dpi: 600
  threshold: 128
  as_printed: 'Figure 30 carries no dimension and no centreline; the engine axis falls
    below the drawn area. Its NASA page stamp is ORIGINAL PAGE IS OF POOR QUALITY,
    but the linework is clean -- the ten tip lines fit to 1.0-1.6 px rms at 600 dpi.
    Stage 1 has no bore foot: its disc runs forward and inward into the integral stub
    shaft, so only stages 2-10 and the CDP seal disc give a bore radius. The drawn
    line is 3-6 px thick (0.06-0.12 cm at the fitted scale) and that, not the fit,
    sets the floor on a read.'
  calibrated_on: the twenty published radii of data/hpc-flowpath.csv -- ten rotor
    blade tips and ten rotor blade roots, each the mean of the row's LE and TE value
  nothing_dimensioned_on_the_page: true
