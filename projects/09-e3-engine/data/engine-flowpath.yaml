# E3 flowpath, component by component, from the transcribed tables.
# Each component sits in its own report's axial datum; the offsets between
# datums are stated where a source gives them and marked open where none
# does. Radii in centimetres. This file is the A3 map; the per-row numbers
# are in the CSVs it points to.

meta:
  built: 2026-09-06
  rule: a radius here comes from a table or a dimensioned drawing, never from a scaled cutaway; Fig 1 of CR-168219 (the whole engine) is a 4-inch unlabelled reproduction and is not digitised

fan_and_booster:
  src: "fan-design.yaml (CR-165148 Table IV, Fig 2 labels, Fig 15 box)"
  datum: "fan rotor stacking axis (Fig 15: Z_SA = 3.2253 in on the report's axis)"
  fan_rotor:
    r_tip_cm: 105.4
    r_hub_cm: 36.05
    r_hub_basis: tip x inlet radius ratio 0.342
    stacking_axis_radii_in: {od: 40.9061, id: 16.4399, height: 24.4662}
    blades: 32
  booster_rotor:
    r_tip_cm: 66.9
    r_hub_cm: 52.3
    r_hub_basis: tip x inlet radius ratio 0.782
    blades: 56
  island: {split_pct_of_flow: 22.3, le_moves_out_cm_for_growth: 1.0}
  rows_axial: {fan: 32, island_stator: 60, booster_rotor: 56, inner_ogv: 64, bypass_ogv: 34, ogv_spacing_rotor_tip_chords: 1.8}
  per_row_coordinates: "Appendix A streamline rows of CR-165148 -- not transcribed (A3 backlog)"
  open: the axial distance from the fan stacking axis to the HPC IGV is not in any transcribed table

hpc:
  src: "hpc-flowpath.csv (Table XXI streamlines 1 and 12), Table X radii in e3-fps-published.yaml"
  datum: "the HPC report's z, zero at the rotor-1 leading-edge hub"
  file: data/hpc-flowpath.csv
  extent_cm: {igv_le_tip: -7.658, ogv_te: "see file"}
  cross_checks: [rotor-1 LE tip radius 35.07 vs Table X 35.08, blade height falls monotonically IGV to OGV, r_bar of every streamline equals Table XXII]
  open: the axial distance from the OGV trailing edge to the HPT stage-1 vane inlet (diffuser plus combustor) is not in a transcribed table; the combustor report gives the dome and liner geometry but not the overall length in one number

combustor:
  src: "combustor-design.yaml"
  known: [30 fuel nozzles and support pins, shingle arc widths (outer 20 x 11.76 cm = 235 cm circumference, inner 15 x 12.24 cm = 184 cm: radii 37.4 and 29.2 cm), diffuser inlet Mach 0.30 and passage 0.16, 5.9 percent bleed]
  open: liner axial coordinates and dome height -- in Figs 1, 22 and 79 as undimensioned drawings; A3 backlog if ever needed at better than 1 cm

hpt:
  src: "e3-fps-published.yaml hpt.flowpath (HPT report Fig 3, dimensioned)"
  datum: stage-1 vane inlet (x = 0)
  stations_cm:
    stage1_vane_inlet: {x: 0, r_hub: 31.5, r_tip: 37.2}
    stage1_vane_exit: {x: 3.5, r_hub: 32.58, r_tip: 36.58}
    stage1_blade_exit: {x: 8.5, r_hub: 32.33, r_tip: 36.60}
    stage2_vane_exit: {x: 15.5, r_hub: 31.22, r_tip: 38.05}
    stage2_blade_exit: {x: 20, r_hub: 31.12, r_tip: 38.10}
  note: the stage-2 blade exit is the LPT's z = 0

transition_duct:
  src: "e3-fps-published.yaml lpt (CR-168219 sec 5.5); lpt-flowpath.csv S1 LE; lpt-aero.yaml Fig 7"
  axial_length_cm: 7.62
  from_sections_cm: 6.85
  outer_wall_slope_max_deg: 25
  outer_wall_mean_slope_from_sections_deg: 21
  radii_cm: {hpt_exit: {hub: 31.12, tip: 38.10}, lpt_vane1_le: {hub: 32.3, tip: 40.8}}
  note: >
    Fig 7 of the LPT report was read off at 33.0 / 43.0 cm for the vane
    leading edge; the sections give 32.3 / 40.8. The read-off of that
    small plot was coarse; the sections are the number.

lpt:
  src: "lpt-flowpath.csv (from the 30 airfoil sections)"
  datum: HPT exit plane (Fig 3 stage-2 blade exit)
  file: data/lpt-flowpath.csv
  extent_cm: {s1_le: 6.85, r5_te: 58.65}
  cross_checks: [R1 LE tip 44.85 vs Table VII 44.55, R5 LE tip 60.08 vs 59.15, radius ratios 0.76 / 0.61 vs Table VII 0.76 / 0.64, Fig 52 lengths sit between the LE and TE heights of every rotor, hub rising to R3 TE then flat through stage 4 then inward at stage 5, 24.0 in overall vs the 24 in calculation model]
  extrapolation_note: >
    Hub and tip come from a straight line through the 10 and 90 percent
    sections. That reproduces Table VII on stage 1 and reads the stage-5
    hub 2.8 percent low (0.61 against 0.64) -- the sections are spaced on
    the airfoil height, whose platform sits a little above the hub wall
    on the tall rear blades. The 10 and 90 percent radii themselves are
    exact; only the walls are inferred. The same overshoot shows on rotor 4,
    whose printed length (20.22 cm) is 3.4 percent under the extrapolated
    leading-edge height.
  hub_cm: {s1_le: 32.32, r4_te: 37.54, r5_te: 36.79}
  tip_cm: {s1_le: 40.78, r5_te: 60.13}

mixer_and_nozzle:
  src: "CR-168219 Figs 39-40 (undimensioned), e3-fps-published.yaml exhaust"
  known: [18-lobe mixer, C-D nozzle with published coefficient 0.996]
  open: lobe geometry and nozzle throat radius are drawings only

whole_engine_stitching:
  status: open
  known_offsets: [HPT exit plane to LPT sections (the LPT datum), HPT Fig 3 within itself]
  unknown_offsets: [fan stacking axis to HPC IGV, HPC OGV exit to HPT vane-1 inlet]
  plan: >
    SUPERSEDED 2026-09-10. The original plan was for Stage H to set the two unknown
    offsets from the bearing spans and frame positions of CR-168219's undimensioned
    cross-section. That is no longer the best available method: CR-159584 Table I p.6
    prints a turbomachinery length of 318.0 cm, which constrains their sum directly,
    and CR-135444 Table 65 p.239 prints a combustor length, which builds up the second
    of them. Stage H's job is now to APPLY the closure recorded under
    assumed_offsets.closure_against_published_turbomachinery_length, in one change
    across every consumer, and to check it.
  assumed_offsets:
    src: >
      Placed by the bearing spans and frame positions of CR-168219's whole-engine
      cross-section, with the allowable range from atlas-facts.md A7. NOT PUBLISHED --
      these are the only two axial numbers in this project that no table gives, and
      every artefact that draws the whole engine must use these same two, so that two
      pictures of one engine cannot disagree. First recorded here 2026-09-08,
      back-sourced from app/turbofan/atlas/flowpath.js, which had carried them since
      2026-09-07 without a home in data/.
    status: assumed
    ranges_corrected: >
      2026-09-10. Both ranges below were WRONG and both excluded the answer: they read
      [110, 150] and [45, 55] cm. Corrected the same day, and the VALUES were then
      applied in a second change once every consumer could be regenerated together.
      See atlas-facts.md A7 and A8.
    values_applied: >
      2026-09-10. The sum comes from CR-159584 Table I's published 318.0 cm
      turbomachinery length; the split between the two comes from the ratio read off
      that report's Fig 1. Sum from a table, split from a drawing -- neither is a free
      choice any more, which is the whole point of the closure below.
    fan_sa_to_hpc_r1_le:
      value_cm: 103.4
      value_was_cm: 142.0
      value_status: applied 2026-09-10 — inside its corrected range and closing the
        published turbomachinery length with its partner
      range_cm: [100.0, 112.0]
      range_was_cm: [110.0, 150.0]
      best_estimate_cm: 104.0
      range_basis: >
        CR-159584 Fig 1 p.7, read numerically at a scale calibrated on that report's own
        Table I p.6, gives 106 +- 7 cm. The 318.0 cm published turbomachinery length then
        constrains this plus hpc_ogv_te_to_hpt_vane1 to about 128.7 cm in total (see
        closure_against_published_turbomachinery_length), which with a 25 cm combustor
        section leaves about 104. The old 110-150 cm range was placed by bearing spans and
        frame positions off CR-168219's undimensioned cross-section, and its floor sits
        above the answer.
      note: fan rotor stacking axis (fan report Fig 15 datum) to HPC rotor-1 LE hub (HPC report z = 0)
    hpc_ogv_te_to_hpt_vane1:
      value_cm: 25.3
      value_was_cm: 48.0
      value_status: applied 2026-09-10 — inside its corrected range and closing the
        published turbomachinery length with its partner
      range_cm: [24.0, 30.0]
      range_was_cm: [45.0, 55.0]
      best_estimate_cm: 25.0
      range_basis: >
        Built up rather than eyeballed. CR-135444 Table 65 p.239 prints an E3
        double-annular COMBUSTOR LENGTH of 17.78 cm (7.0 in), and p.237 calls the
        prediffuser 'a very short-length design'; CR-159584 Fig 1 read at the calibrated
        scale gives 25.9 cm for the whole OGV-TE-to-vane-1 span. The old 45-55 cm was
        scaled by eye off CR-168219 Fig 1 p.4 / Fig 22 p.59 — figures this project
        deliberately does not treat as sources — and is roughly 2x the built-up value.
        CR-168301 sec 3.1 says the hardware combustor is shorter still than QCSEE's
        17.8 cm, so 17.78 is an upper bound on the liner term.
      note: >
        HPC OGV trailing edge to HPT stage-1 vane inlet, spanning the diffuser and the
        double-annular combustor. The combustor's own axial coordinates are undimensioned
        in Figs 1, 22 and 79, which is why this cannot be built up from its own drawing —
        but it CAN be built up from CR-135444's printed liner length, which is what the
        corrected range does.
    closure_against_published_turbomachinery_length:
      status: MET — applied 2026-09-10; 103.4 + 25.3 = 128.7 against a required 128.7
      src: "CR-159584 Table I p.6: turbomachinery length, fan front flange to LP turbine aft frame flange = 318.0 cm (125.2 in)"
      definition_check: >
        Measured on CR-159584 Fig 1, the printed 318.0 cm runs to the LPT CASING's aft
        flange at the R5 exit plane (3.21 m read), not to the aft face of the turbine rear
        frame (3.69 m read). It excludes the rear frame and the mixer. Get this wrong and
        the test is 50 cm out.
      identity: >
        LPT_R5_TE - y_fan_front_flange
          = fan_sa_to_hpc_r1_le + HPC(78.2) + hpc_ogv_te_to_hpt_vane1 + HPT(20.0) + LPT(58.65)
        with HPC, HPT and LPT lengths all published (hpc-flowpath.csv, HPT Fig 3,
        lpt-flowpath.csv). Only the two assumed offsets are free, so the published
        318.0 cm constrains their SUM and leaves only the split open.
      required_sum_cm: 128.7
      required_sum_basis: 318.0 - 78.2 - 20.0 - 58.65 - 32.5, with the fan front flange at y = -32.5 cm
      fan_front_flange_cm: -32.5
      fan_front_flange_status: assumed — app/turbofan/atlas/parts-core.js fan-case shell; the required sum moves 1:1 with it
      current_sum_cm: 128.7
      previous_sum_cm: 190.0        # 142.0 + 48.0
      excess_cm: 0.0
      previous_excess_cm: 61.3
      independent_read_sum_cm: 132.0   # 106 + 25.9 from CR-159584 Fig 1, agrees with 128.7 to 2.6 %
      when_applied_check:
        - fan_sa_to_hpc_r1_le + hpc_ogv_te_to_hpt_vane1 == 128.7 +- 4 cm
        - every consumer below re-runs and produces one axial layout, not two
      consequences_of_applying: >
        Moves every blade row, the meridional plot (unit J1), the glTF export (unit J3),
        the site cutaway (unit J7) and the drawing pack's stations 4 and 45 (unit J5
        finding 166, which are parenthesised precisely because they inherit this offset).
        It also unblocks the three aft-end nacelle numbers held back from the atlas —
        overall nacelle length 603.3 cm, exhaust nozzle diameter 159.0 cm and the 11 deg
        terminal boat-tail — which fix the aft end of a body whose aft end has not moved.
    consumers: [app/turbofan/atlas/flowpath.js (HPC0, HPT0), solvers/publication/meridional.py (unit J1)]
