  - stage: C4-3
    what: CFD against the Rotor 37 validation case
    band: null
    achieved: null
    state: gated
    gate_2026_09_10: >
      Still gated, but the fault is now LOCALISED rather than merely
      characterised. The field was inspected for the first time (finding 194):
      the inner 87 percent of span flows forward and the outer 13 percent is
      reversed, with swirl exceeding blade speed and 597 K rotor-worked gas
      driven back past the inlet plane. The periodics carry flux, so that
      hypothesis is closed. A constant back pressure collapses too, which
      kills the throttling explanation (finding 195). And the solution never
      reaches a steady state at all -- work swinging from -3 to +91 percent
      of design across 1500 iterations -- so the next step is a TRANSIENT
      solve rather than a fifth variation on the steady setup (finding 197).
    gate: >
      The mesh is built and checked (C4-3) and the case runs, but it
      collapses onto a stalled branch at 26 % of design flow and 13 % of
      design work, repeatably, near iteration 700. Three MRF faults were
      found and fixed and the rotor now compresses (T_out 416.6 K at
      iteration 236) but does not hold. Characterised in
      solvers/cfd/STEP0.md unit C4-4, findings 140-142, with the four
      things to try next in order. Not a gate on anything external -- this
      is a bug to find.

  - stage: D3
    what: total secondary air against Table XI's 16.1 % of W25
    band: 0.5
    achieved: 0.04
    units: percent of W25
    state: met
    gate: null
    note: >
      CLOSED 2026-09-18 by unit D9. The budget half closed at 0.04 percent in
      2026-09-06; the sentence "every cavity keeps hot gas out" is now
      answered for ALL FOUR numeric backflow margins CR-167955 prints -- the
      stage-1 nozzle's forward and aft cavities (D3, and the reference
      pressure each is measured against settled by D7's finding 233) and the
      stage-1 blade's tip and dovetail here. All four exceed unity, including
      the inducer-seal damage case, and the design dovetail pressure ratio
      sits 9.3 percent above the printed minimum supply ratio.

      The closure is met as the INEQUALITY it is written as. A forward
      reproduction of the printed 1.10 to 0.5 percent -- what D7 achieved on
      the vane -- was declared unreachable in step 0 and is not attempted:
      the blade's margin is a ratio to a RELATIVE total, reached through a
      rotational pump and a five-pass serpentine whose internal pressure loss
      the report never prints (finding 249). The inversion that replaces it
      gives 24.5-29.9 percent of internal loss, which is physical, on a
      bracket that is a vortex law rather than a fudge.

      Two results step 0 did not ask for. The vortex law decides the SIGN of
      the spanwise term on a 4 cm blade, not its size, which is a band stated
      before the run and missed (finding 250). And Fig 26's tip line is nine
      times flatter than proportionality, so an 11-point loss of dovetail
      supply ratio costs only 1 point of tip margin -- which is the whole
      reason the inducer-seal failure case survives (finding 251).

      Named so it is not later recorded as unchecked: the stage-2 nozzle's
      "positive coolant backflow margin" is a listed design feature with no
      printed number.

  - stage: D4
    what: cruise clearance, two independent routes
    band: 0.2
    achieved: 0.04
    units: percent of span
    state: met

  - stage: E1
    what: Table X centrifugal stresses, all ten HPC stages
    band: 10.0
    achieved: 6.5
    units: percent
    state: half
    gate: >
      EVALUATED 2026-09-18 by unit E10 rather than gated, and it MISSES:
      a same-stress Larson-Miller transfer from CR-167955 Fig 84's stage-2
      limiting point (341 h at 926 C, LMP 27,020 at C = 20) to the stage-1
      blade's published pitch metal temperature gives 109 h against a
      published 264 -- a factor of 2.43 against a band of 2. Step 0 said
      "about 110 h, a factor of 2.4, just outside" before the run.

      The old gate said no creep data is sourced. It is sourced, and it was
      inside the report the closure is about: Fig 84 p.142 prints eleven
      (rupture life, metal temperature) pairs and hpt-mechanical.yaml has
      carried them since 2026-09-05 (finding 244). What is actually missing
      is STRESS. The two blades' pitch-section areas were never published --
      the same absence that leaves the HPT's four airfoil rows out of the
      G3 assembly -- so the ratio sigma_1/sigma_2 the miss implies, 0.90 to
      0.94 over a rupture exponent of 8 to 15, cannot be checked against
      anything (finding 247). A published Rene 150 rupture curve would be a
      second route and is on no document on disk; F1 already records
      MIL-HDBK-5J as carrying none of Rene 77/95/150 or AF115.
    note: >
      Three of E10's five bands pass and two miss. Fig 84 and Fig 35 are the
      same section at the same condition and agree to 1 K and 0 K once it is
      understood that a BUCKET CREEP life map covers the wall interior and
      not only the skin -- against surface nodes alone the cold end misses
      by 47 K (finding 245). The two blades' separately computed mission
      mixes independently imply the same climb severity, 8.1x and 7.6x
      (finding 246). And the standing "50 C is 10x creep life" rule comes
      out at 7.98x on the E3's own numbers, 0.2 of a point outside its own
      band (finding 248).

  - stage: E2
    what: the bore doubling for a small hole
    band: 0.5
    achieved: 0.0
    units: percent
    state: half
    gate: >
      The closure also asks HPT disc peak effective stress within 10 % of
      Fig 64. Unit E12 replaces "the disc cross-sections were never
      digitised" with a measured reason. CR-167955 Fig 63 p.114 -- the
      stage-1 disc FE mesh -- carries NO flowpath, NO dimension and NO
      published length; its top edge is the dovetail seat, below the
      flowpath hub by an unpublished platform-and-shank height (finding
      263). The route through Fig 64's magnified dovetail detail and E5's
      printed neck widths is SINGULAR, not merely weak: the determinant is
      the pitch growth over the tang separation (0.083-0.165 cm) minus the
      printed neck-width difference (0.132 cm), so a half-millimetre
      reading error moves the scale by x0.73-1.61 (finding 264).
      Fig 112 p.180 IS drawn over the published flowpath and calibrates to
      0.050 cm rms on four anchors, which is worth 1.0 % of r at the disc
      RIM -- E2's dominant term, since bore hoop stress goes as the rim
      radius squared -- but only 9.0 % at a bore 18 cm below the anchors
      (finding 267). TARGET CHOSEN, before any stress was run: Fig 64, not
      Fig 55, because Fig 63 is the mesh of the model Fig 64 reports.

      NARROWED 2026-09-22 by unit E14, which did what E12 named: Fig 50 p.87
      is calibrated (0.027 cm rms on the same four anchors) and put against
      Fig 112 feature by feature. THE BORE WAS NEVER THE BINDING CONSTRAINT.
      At the MEASURED rim -- 30.768 cm, the dovetail seat, the one line
      drawn between platform and disc body, which replaces the 32.455 cm
      flowpath hub disc.py had been using -- the constant-thickness bracket
      is 770 to 1570 MPa and contains Fig 64's 1034. Moving the bore across
      the entire 6.90-8.29 cm disagreement between the two figures moves the
      answer -0.33 to +0.37 %; the rim measurement is worth 9.1 %; the
      published speed ambiguity is worth 9.1 %; the PROFILE is worth 51 %
      (findings 284-286). So this gate is no longer the bore.
      WHAT IS LEFT, in order: (1) Fig 64 does not say which of two speeds
      4.9 % apart its "40 s into accel" is -- Fig 53's 13,300 or the
      dovetail figures' 13,948 -- and that alone is 9.1 % of a bore stress,
      so a 10 % band cannot be met from the record until CR-167955 p.100 and
      p.115 are re-read; (2) a traced t(r) for the stage-1 disc, which needs
      an axial scale and a judgement at every radius about which of several
      overlapping parts a line belongs to. Neither is another calibration.

  - stage: E3
    what: blade first flex, the unshrouded booster
    band: 15.0
    achieved: 2.7
    units: percent
    state: met
    note: "the case the beam should get right, and does"

  - stage: E3
    what: >
      first three modes of every HPC stage against Figs 33-42, each point
      against max(5 %, that point's own reading uncertainty)
    band: 5.0
    achieved: 21.4
    units: percent, mean over 24 comparisons
    state: half
    gate: >
      RESTATED 2026-09-19 against each reading's own uncertainty, and the
      miss survives it. Finding 160 had shown that 11 of the 24
      comparisons cannot resolve 5 % at all and that NONE of the ten
      first-flex modes can -- reading a 350 Hz line off a 0-6 kHz axis to
      half a minor division is +-14 %, so a 5 % band there was never a
      test. The per-point band is now max(5 %, u), never narrower than the
      plan asked and widened only where the figure itself cannot answer.

      1 of 24 becomes 2 of 24. The reading cannot be the cause and the
      arithmetic says so: on the thirteen points where 5 % IS resolvable
      the mean error is +24.4 % against a mean uncertainty of 2.2 %.
      Finding 276.

      The cause stands as finding 84 named it -- a clamped beam is the
      stiffest root a blade can have and a dovetail in a slot is not a
      clamp -- and the bias grows with mode number, 1F +15.8, 2F +18.1,
      3F +44.0, which is that mechanism's signature.

      What would move it, and what would not: an FE blade is NOT
      recommended (finding 277). Its value is in modelling the dovetail,
      and the HPC dovetail geometry is unpublished (finding 273, E5's
      restatement), so its root would be assumed -- and the root is the
      entire mechanism under test. It could in any case only move the
      thirteen resolvable points, all of them 2F and 3F. Named instead: a
      ONE-parameter root-flexibility spring, calibrated on a single stage
      and PREDICTED on the other nine, which is falsifiable, costs a day,
      and tests the mechanism rather than fitting the answer.

  - stage: E4
    what: >
      no rotor critical inside the operating band, and the thrust-bearing
      axial load transcribed from its published measurement in both
      directions
    band: 0.0
    achieved: 0.0
    units: count of criticals inside the band
    state: met
    gate: null
    note: >
      RESTATED 2026-09-19, and the restatement began with a correction.
      The old gate read "no bearing load or capacity is printed anywhere".
      That was a true statement about CR-168219 sec 5.7 and a false one
      about the source list: CR-168211 Figs 340-341 pp.527-528 print the
      axial load of BOTH thrust bearings against corrected speed, each on
      a pounds and a kN axis, with "positive thrust is in the forward
      direction" stated in the same paragraph. Finding 269 -- the fifth
      time in this project that a recorded absence has been a statement
      about the reader rather than about the engine.

      The CAPACITY is still printed nowhere, and neither is a bearing bore
      nor a DN, so the capacity clause is DROPPED rather than answered
      with a catalogue value: a catalogue capacity would need an assumed
      bore AND an assumed internal geometry, and a margin two assumptions
      deep is not a margin. data/icls-thrust-bearing.yaml records the
      absence explicitly, with the five documents searched.

      What the restated closure claims, and checks: the No. 3 bearing is
      loaded FORWARD, flat at 3.1 kN to 75 % corrected core speed and
      44.5 kN at 94.4 %; the No. 1 bearing is loaded AFT, reaching
      -82.8 kN at 98.3 % corrected fan speed; the printed pound axis
      closes on the printed kN axis to 0.048 kN over eleven label pairs;
      and the No. 3 load is NOT a centrifugal quantity -- N-squared would
      give x1.58 over that speed range and it rises x14.4, a factor of 9
      out (finding 271, and E2's finding 78 in a different part of the
      engine). Finding 270 prices D6 with it: the HP rotor's known axial
      terms sum to +556 kN and the bearing carries +44.5, so the terms D6
      has no geometry for are worth about half a meganewton.

      What would move it further: a computed load to put against the
      measured one, which is D6's thrust balance and needs the HPT disc
      faces and the balance piston. Nothing published can ever give the
      capacity.

  - stage: E5
    what: >
      every attachment for which a stress and an allowable are printed has
      margin, and the weak-link order holds
    band: 0.0
    achieved: 0.0
    units: percent by which any attachment exceeds its allowable
    state: met
    gate: null
    note: >
      RESTATED 2026-09-19. The old gate read "HPC dovetails per sec 3.2.3;
      hpc-mechanical.yaml has no blade or dovetail block at all", which
      reads as work not yet done. It is not work: **HPC report sec 3.2.3
      is a list of nine design criteria in words and contains no number**
      -- "provide adequate margins in neck tensile and tang shear stress",
      "design to acceptable crush stresses" -- and the table it points at,
      Table X, prints the AIRFOIL root stress, which unit E1 reproduces
      from the blade integral. Searched beyond the HPC report: the words
      neck, tang shear and crush appear in it exactly twice, both inside
      that criteria list; CR-135444's dovetail stress data (Fig 72,
      Table 62) are the HP turbine and the LP turbine, and its
      compressor-rotor section pp.169-174 prints materials and a disc
      stress distribution and no dovetail stress. Finding 273.

      So the HPC dovetail is recorded as UNPUBLISHED, not as unfinished,
      and the closure is narrowed to the attachments whose stress and
      allowable are both printed -- HPT two-tang, fan blade and post, LPT
      retainers, booster -- all of which E5 already did on 2026-09-07 and
      all of which have margin. Two recorded misses inside the unit stand
      unchanged: LPT Fig 70's two DISC sections do not reproduce their own
      printed Kt (finding 100), and the manifold flange needs 1,119 MPa of
      bolt stress against a ~1,000 MPa proof (finding 102).

      What would move it further: nothing in the public record. An HPC
      dovetail check needs a neck width, a tang geometry and a disc slot,
      and none of the forty-one documents prints one.

  - stage: F1
    what: >
      every Stage E stress compared with an allowable, each comparison
      naming whether the allowable is one an E3 report prints for that
      part or a handbook room-temperature value, and every
      room-temperature comparison carrying the loss its margin can absorb
    band: 0.0
    achieved: 0.0
    units: percent by which any stress exceeds its allowable
    state: met
    gate: null
    note: >
      RESTATED 2026-09-19. The plan asked for an allowable AT the part's
      metal temperature. That cannot be had for the ten HPC blade roots,
      and the reason is sharper than the old gate's "figures, not tables":
      MIL-HDBK-5J's elevated-temperature curve for Ti-8Al-1Mo-1V is
      Figure 5.3.2.1.1 and it is for **SHEET, single-annealed**, where the
      room-temperature allowable F1 uses is Table 5.3.2.0(c), **bar and
      forging**. Digitising that curve and applying it to a blade root
      would be an unsourced transfer between product forms -- worse than
      not having the number, because it would wear a handbook's authority.
      Finding 274. Inconel 718 is the same shape of problem (Figure
      6.3.5.1.1), and Rene 77, 95, 150 and AF115 are absent from the
      handbook entirely, so the superalloy parts were never in its scope.

      The restated closure is exactly what the seventeen-row margin table
      already does: 7 rows against an allowable an E3 report prints for
      that part, 10 against a handbook room-temperature value WITH the
      fraction of the allowable the metal may lose before the margin is
      gone -- 56 % on the tightest of them. Every row names its basis;
      every margin is at or above 1.00; three sit exactly on the limit.

      What would move it: elevated-temperature bar/forging allowables for
      Ti-8-1-1 and Inco 718 from a source that prints them for the right
      product form. MIL-HDBK-5J is not that source.

  - stage: F2
    what: >
      every mass built from geometry compared with a published mass of the
      same thing, and the module weights two documents each print made to
      agree
    band: 20.0
    achieved: 17.9
    units: percent, worst of ten built airfoil masses against Table X
    state: met
    gate: null
    note: >
      RESTATED 2026-09-19. The plan asked for the basic engine within 10 %
      of 3,473 kg. Finding 112 already said why that is not reachable and
      this restatement puts a number on it: **12.4 % of the basic engine
      has tabulated geometry at all** -- 430 kg of blading across three
      rotor modules. The discs are figure-status, the casings and frames
      are figure-status, and Table XXVI's own 320 kg of sumps, drives and
      seals has no printed geometry anywhere in the source list. A total
      assembled past those gaps would pass a 10 % band by arithmetic and
      not by evidence, which is the one thing this project exists not to
      do.

      What the restated closure claims and checks, both already run on
      2026-09-07: the built airfoil masses against Table X's ten printed
      airfoil weights, mean -9.8 % and worst -17.9 % against a +-20 %
      band, with the one-sided sign explained by the missing edge radii
      (finding 109); and the five module weights that two separate
      documents each print, agreeing to 3.2 % worst with one exact
      (finding 111).

      What would move it toward the original wording: the HPC and HPT disc
      profiles, which unit E11 has now shown are digitisable from HPC
      Fig 30 and unit E12 has shown are NOT from CR-167955 Fig 63. Even
      with every disc, the 320 kg of sumps and drives has no geometry in
      any source, so the original 3,473 kg closure is not reachable from
      the public record at all.

  - stage: G1
    what: generated blade volume against Stage F2's integral
    band: 2.0
    achieved: 0.94
    units: percent
    state: half
    gate: "the closure also asks the generated engine mass to match F2, whose own total is gated"

  - stage: G1
    what: blade-to-blade interference, all 32 rows
    band: 0.0
    achieved: 0.0
    units: cubic metres of overlap
    state: met

  # Stage H was ONE closure holding two unrelated problems. Split 2026-09-18.
  # The names follow WORK-PLAN.md's own Stage H numbering -- H1 Gates,
  # H2 Static structure, H3 Sumps and bearings, H4 Assembly, motion, section --
  # so the kinematics closure is H4 and the hand-CAD closure is H2-H3. They are
  # deliberately NOT called H1 and H2, which would put two different things
  # under one name in one repository.

  - stage: H4
    what: zero clashes through a full rotation of both spools, at the published LP:HP ratio
    band: 0.0
    achieved: 0.0
    units: row pairs overlapping axially, out of 496
    state: met
    gate: null
    note: >
      CLOSED 2026-09-18 by unit H4, and it needed no hand CAD. G3 places all
      32 rows at their true stations, so this is a script.

      The result is a PROOF rather than a sweep: two rows whose assembled
      axial extents do not overlap cannot touch at any relative angular
      position, and none of the 496 pairs overlaps -- not merely none of the
      31 consecutive ones G3 checked. The 360-step sweep over one LP
      revolution was run anyway, on the real solids, and moves the tightest
      real gap (7.50 mm, HPC stator 4 to rotor 5) by 0.000 mm. That tests
      the placement transform rather than the engine, which is the point:
      a scale, a shear or an off-axis rotation centre would show up nowhere
      else (finding 254).

      Two results step 0 asked for and got. The LP:HP ratio is one number
      across the glTF and unit I1's four-route reconciliation, 3.5833
      against 3.5739. And the assembly's own vane counts ARE the engine
      orders GE drew its Campbell diagrams against: every one of the ten
      HPC rotor stages carries its downstream stator's count among its
      printed per-rev lines and nine of ten carry its upstream one, and the
      HPT stage-2 blade's 72/rev is the LPT stage-1 vane count printed in a
      different report (finding 255). The single absence is rotor 1's
      variable IGV and it is unresolved (finding 256).

  - stage: H2-H3
    what: the static structure and the sumps in hand CAD, and every bearing pointed at with its load
    band: null
    achieved: null
    state: gated
    gate: >
      Two gates, neither of them the tool. (1) NO BEARING LOAD OR CAPACITY IS
      PRINTED ANYWHERE: CR-168219 sec 5.7 names all five bearings, their
      types, sumps, seals and lubrication and gives no load -- unit E4's
      closure carries the same gate -- and the thrust balance that would
      produce one is itself gated on the HPC disc bore radius (D6, finding
      193). (2) The hand-CAD half needs a human at a GUI. The plan's old
      note that Fusion's install is corrupt was checked on 2026-09-07 and is
