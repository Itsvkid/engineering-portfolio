    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      The README claimed "37 tests" through nine stages and eight hundred
      test functions (finding 168). Status, stage table, closure scoreboard,
      figure list and outstanding work are now generated by
      tools/build_readme.py between markers, and tests/test_readme.py fails
      on drift. CI runs the whole suite; the two files needing cadquery
      declare it with importorskip rather than being named in a list.

  - stage: J5
    what: the drawing pack renders a GA and one sheet per module, every assumed dimension parenthesised, no station drawn at an unpublished position
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      Six A3 sheets. Nine dimensions, each with a source: 5 published, 2
      derived, 2 assumed and parenthesised in the drafting convention for a
      reference dimension. 4 of the 10 gas-path stations can be placed and
      two of those four inherit J1's assumed offset, so they are
      parenthesised too (finding 166). Six stations are left off with the
      reason printed. Three sheets exist to state a gap -- combustor, HPT,
      fan (finding 167).

