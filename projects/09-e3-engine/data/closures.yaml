  - stage: G2
    what: the inner OGV builds with its sections on planes normal to a 60-degree swept, 20-to-0-degree leaned stacking axis
    band: 2.0
    achieved: 0.0064
    units: percent of vane volume
    state: met
    gate: null
    note: >
      CLOSED 2026-09-18 by unit G2b, and NOT ONE NUMBER IN THE CAD CHANGED.
      Three of the four checks always passed -- sections normal to the axis
      by construction, a valid solid, 64 vanes with zero overlap -- and the
      fourth compared the CAD against the volume of a prism swept along a
      STRAIGHT path, which is what the trapezoidal integral of A ds is.

      The reference now carries the only first-order term a curved path has,
      Pappus's second theorem in differential form: V = integral of
      A (1 - c_bar . dT/ds) ds, the section centroid's offset from the
      stacking axis dotted with the curvature vector. That takes the vane
      from -2.1056 percent to +0.0064, a factor of 327, and it is identical
      to the old integral wherever the axis is straight -- checked to
      1.6e-15 -- so none of the other 31 rows moves (finding 253).

      The size of the term is the size of the mistake: the sections are
      built from their leading edge, so the axis carries a centroid offset
      of about 0.45 of a chord, four centimetres on a vane whose lean bends
      the axis 20 degrees over eleven.

