meta:
  src: "WORK-PLAN.md's own *Closes when* sentences, and each solver's STEP0.md status line"
  written: 2026-09-07
  purpose: >
    Stage I1's third bullet asks that every "closes when" tolerance be
    re-checked after Stage G's geometry. This is that list, machine
    readable, so the re-check is a test rather than a reading. `achieved`
    is the number the solver produces now, not the number quoted when the
    unit was written -- if a later stage moved something, the test fails.
  state_values:
    met: the closure sentence is satisfied
    half: one half of a two-part closure is satisfied and the other is gated
    gated: cannot be evaluated, and `gate` says on what
  sign_convention: >
    `achieved` and `band` are magnitudes of error, so a closure is met when
    achieved <= band. Where the plan's band is not a number -- "inside the
    digitising uncertainty" -- `band` is null and a `note` says why, and
    the test requires that note rather than inventing a figure.

closures:

  - stage: B1
    what: the mixer reproduces Table XXIII's sfc improvement
    band: null
    achieved: 0.7
    units: points on the level
    state: half
    gate: "open on the LEVEL. Table XXIII's column-to-column differences reproduce to 0.25 point, but the level is 0.7 point high because mass-weighted total pressure is the ideal upper bound. Needs Fig 39/40's mixing-plane area, which is Stage H."
    note: "3.6 % at 85 % effectiveness against a separate-flow engine without the mixer's own 0.57 % loss"

  - stage: B3
    what: sfc at three ratings against Table XII
    band: 1.5
    achieved: 1.91
    units: percent
    state: half
    gate: "two of three inside the band. Takeoff reads +1.91 % and is a strict xfail with its size pinned; the cause is recorded -- Table XII is a mixed-day table, T41 on the flat-rating day and sfc on the standard day."
    note: "max climb +0.46 %, max cruise +0.56 %"

  - stage: B4
