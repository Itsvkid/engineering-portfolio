    band: 2.0
    achieved: 1.35
    units: percent of row volume, web variant
    state: met
    gate: null
    note: >
      app/components/EngineCutaway.js and public/models/e3-blading.glb.
      The page decides nothing: every row node carries extras.spool (lp 7,
      hp 10, static 15) and the scene carries extras.kinematics with unit
      I1's reconciled LP:HP ratio of 3.583. Verified by loading the file
      through the real three.js GLTFLoader in Node, not against the
      specification -- which is how finding 172 was caught, three.js not
      surfacing asset.extras. The web variant is a separate artefact at
      2 mm and a 2 percent band; the archival file stays at 0.6 mm and 1.
      Co-rotation is declared inside the file as a modelling decision, not
      a published fact.

  - stage: J8
    what: the two assumed axial stitching offsets close the published turbomachinery length
    band: 4.0
    achieved: 0.0
    units: percent of the 318.0 cm fan-flange-to-LPT-exit length
    state: met
    gate: null
    note: >
      CR-159584 Table I p.6 publishes the turbomachinery length, fan front
      flange to LP turbine exit, as 318.0 cm. With the HPC (78.2), HPT
      (20.0) and LPT (58.65) lengths all published, that constrains the two
      assumed offsets' SUM to 128.7 cm and leaves only the split open. They
      had carried 190.0 between them, so the core was drawn 61 cm long.
      Applied 2026-09-10 as 103.4 and 25.3: sum from the table, split from
      the ratio read off the same report's Fig 1. Both now sit inside their
      own corrected ranges, which had themselves been wrong -- the old
      110-150 and 45-55 cm both had floors above the answer. One definition
      trap recorded: the printed 318.0 cm runs to the LPT CASING's aft
      flange at the R5 exit plane, not the aft face of the turbine rear
      frame; 3.21 m against 3.69 on the same drawing.

  - stage: J9
    what: the mixed-flow nozzle exit area from continuity on the published cycle matches the printed diameter
    band: 3.0
    achieved: 0.3
    units: percent of exit diameter
    state: met
    gate: null
    note: >
      A 1979 status table and a continuity solve on the published cycle,
      agreeing to three parts in a thousand. At the max-climb aero design
      point the mixed stream is 244.2 kg/s at 368.6 K and 59,435 Pa, so the
      nozzle pressure ratio is 2.49 and the throat chokes -- which is why
      the report specifies a convergent-divergent nozzle. That gives a
      throat diameter of 1.586 m against CR-159584 Table I's printed
      1.590 m. The same chain returns 41.5 kN of max-climb net thrust,
      23.9 percent of the 173.5 kN sea-level takeoff rating, which is the
      right ratio at Mach 0.8 and 35,000 ft and is the check on the mass
      flow standing behind the area.

  - stage: L1
    what: ME TF0.01 reproduces the E3 at its own bypass ratio before the excursion leaves it, the mixer closes at the published p5/p13 across the sweep, and the LPT stage count falls out of a measured loading limit rather than being chosen
    band: 1.0
    achieved: 0.49
    units: percent, worst of the reproduction checks
    state: met
    gate: null
    note: >
      Stage L is the owner's derivative, not part of the reconstruction:
      a fixed-core bypass excursion at the same thrust class, every number
      derived rather than transcribed. Distinct from Stage K, which is GE's
      own growth engine pushed harder with the reports' numbers.

      Band 3 is the one worth reading: two independent routes to the LPT
      work agree to 0.49 percent with nothing fitted between them. Bands 2,
      4 and 5 check against the model's own baseline or a design rule and
      are marked L2 for that reason, which is the honest level for a
      derivative -- ME TF0.01 was never built, so there is no published
      performance for it to be validated against, and every number in it
      drops one rung from the reconstruction it stands on.

      The band did work rather than decorate. A scoping solve had said
      bypass ratio 10 closes at seven LPT stages, on a fan tip Mach of 1.47
      judged acceptable after it was seen. Step 0 fixed the ceiling at 1.45
      beforehand -- the E3's own fan runs 1.41 -- and seven stages fails
      it. The answer is eight. Two points of Mach number is one whole
      turbine stage, and stating the ceiling first is what caught it.

  - stage: E7
    what: the five LPT flutter safety factors imply one allowable index, and the five agree
    band: 15.0
    achieved: 24.4
    units: percent departure from the mean implied allowable
    state: half
    gate: >
      NOT MET on the definition STEP0 named before the run (rotor relative
      exit velocity): the five implied allowables spread 1.61x, worst
      24.4 percent. The departure is MONOTONE, 39.7 to 63.8 front to back,
      which points at the model rather than the data -- the beam's
      first-flex frequencies fall 6.1x across the five stages where Table XI
      implies about 3.8, and the beam pins the tip shroud without its mass
      (findings 173-175). On the INLET reading of Table XI's ambiguous
      "relative flow velocity", stages 1-4 agree to 4.2 percent and stage 5
      departs 33 percent; reported, not adopted.
    note: >
      Torsion is not modelled: the beam gives flexural modes only. Table XI's
      torsional column is carried as published data and compared with
      nothing.

  - stage: E8
    what: uncorrected root gas bending on all five LPT stages, from the C1 mean-line loads and the transcribed root sections
    band: 25.0
    achieved: 17.7
    units: percent
    state: met
    gate: null
    note: >
      LPT Table VIII rather than HPC Table X, because Table VIII prints the
      whole decomposition -- centrifugal, uncorrected gas bending, and the
      leading-edge resultant -- where Table X gives only a maximum and a
      centrifugal part. Errors -3.8, -8.3, -9.8, +7.0, +17.7 percent: both
      signs, so scatter rather than a missing term. The report's own
      sentence about the stacking tilt is checked as an inequality and holds
      on all five stages, cancelling 51 percent of the bending on average;
      the tilt angle itself is not printed anywhere and is not reproduced.
      The first run was 43-62 percent low until Euler's identity caught a
      counter-swirl sign convention (finding 176).

  - stage: I4
    what: every recorded reading uncertainty is in the register with the closures it governs and a resolvability verdict, and the unstated ones are counted
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      5 recorded reading uncertainties against 263 distinct figure citations
      across 14 data files -- 14 percent coverage on the generous count, which
      is Stage A3's last line measured rather than described (finding 178).
      Only one of the five is numeric per point, and the other four are left
      as the prose their files record rather than being quantified into
      something that would look measured (finding 179). The one that can be
      computed reproduces finding 160: 13 of E3's 24 comparisons can resolve
      the 5 percent band they are judged against, and 0 of the 10 first-flex
      modes can.

  - stage: G2
    what: the inner OGV builds with its sections on planes normal to a 60-degree swept, 20-to-0-degree leaned stacking axis
    band: 2.0
    achieved: 2.09
    units: percent of vane volume
    state: half
    gate: >
      Three of four checks pass: the sections are normal to the axis by
      construction, the solid is valid, and 64 vanes have zero overlap. The
      volume misses by 0.09 of a point -- and finding 181 shows the reference
      is the thing that does not apply: with the axis straightened, the same
      CAD against the same integral agrees to 0.015 percent, and the whole
      gap is a Pappus term the trapezoidal integral omits for a curved
      stack. The band stands as a miss because it was stated before the run.
    note: >
      Built on the plain reading of Table VII's 11.61 cm as a radial span.
      Two independent lines say it may be measured along the swept axis
      instead -- Appendix A's aspect ratio and the core duct's axial space
      (finding 182). The vane overhangs the assumed hub by 5.7 cm on either
      reading and must be endwall-trimmed, as Rotor 37's blade was
      (finding 183).

  - stage: C5
    what: the HPC's published stall-margin design intent is reproduced -- stages 6-7 least loaded at design, 6-7 loading up at intermediate speed, 8-10 unloading at low speed
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      Four figure-checkable claims hold exactly: Figs 14 and 18 independently
      pick stages 6 and 7 as the two least loaded, Fig 18 puts 8-10 highest at
      design, and the published variable geometry (IGV and stators 1-4) makes
      stage 6 the first uncontrolled one exactly as the prose requires
      (finding 184). The stage-stacking march reproduces both part-speed
      claims -- 6-7 among the four most loaded at 85 percent speed over a wide
      flow window, 8-10 the three least loaded at 70 percent over a narrow
      one -- and closing the VSVs widens that narrow window by 31 percent
      (finding 187). The characteristic has no free parameter. NO STALL MARGIN
      IS REPORTED: no stall line for this compressor is published, and neither
      is a VSV schedule.

  - stage: E9
    what: the HPC rotor's joint torque as a function of position, bounded by the HP spool torque and by the HPT joint
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      The work split closes on Fig 14's own printed total to 0.000 C, the
      torque fraction is monotone from 0.108 aft of stage 1 to exactly 1.000
      aft of stage 10, and every forward position sits below the HPT
      inducer-disk joint's demand. The rotor has TWO kinds of joint -- welds
      plural and internal, one bolt joint between drums -- and no position is
      published for either (finding 188), so the result is a curve rather
      than a number (finding 189). The unresolved stage-4 vs stage-7 material
      question is worth a factor of 1.67 in joint torque (finding 190).
      Not attempted: weld positions, bolt count, bolt size, bolt-circle
      radius, axial load. None is published.

  - stage: D6
    what: thrust balance on the HP rotor -- the net axial load and what the balance piston must trim
    band: null
    achieved: null
    units: null
    state: gated
    gate: >
      GATED on the HPC disc BORE RADIUS, the un-digitised disc profile --
      the same figure that gates E2's peak stress, E2's burst margin and
      F2's disc masses (finding 193). The gas-path annulus term closes and
      is -105.9 kN aft over the ten HPC rotors; the disc-face term, which
      the annulus control volume excludes, is +342 to +672 kN forward over
      any plausible bore, 3.2 to 6.4 times larger. The balance is decided by
      the term that cannot be computed. Also: HPT report Figs 95-96, which
      the plan item names, give the balance-piston seal as HARDWARE and
      never as a load -- no thrust, area, radius or cavity pressure
      (finding 191).
    note: >
      STEP0 predicted the HPC rotors would push forward and they push aft on
      that control volume -- right about the rotor, wrong about the control
      volume (finding 192). Not attempted: the mission sweep and the bearing
      1 and 3 loads, both of which need the balance first.

  - stage: K2
    what: the FPS hardware re-margined at the published growth speed, and GE's "oversized for growth" claim tested against it
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      The LP-spool speed ratio is published for all three ratings (fan
      corrected tip speed, FPS against growth) and cross-checks against the
      separately printed booster increase to 0.11 points. Scaling F1's
      margins by that ratio squared splits them exactly along the claim's own
      boundary: the three fan parts the claim covers survive at 1.037, 1.191
      and 1.397; the three LPT blade retainers, which are not hub radii, go
      to 0.828, 0.819 and 0.810 (finding 198). At the third rating even the
      fan dovetail corner goes under, at 0.964 -- the headroom is real and
      thin (finding 199). Eleven of the seventeen rows are HP-spool and OUT
      OF SCOPE because no growth HP speed is published, including the HPT
      dovetail at exactly 1.000 which would have been the sharpest test
      available (finding 200). Reported as a bound, not a prediction
      (finding 201).

