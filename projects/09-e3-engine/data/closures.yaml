meta:
  src: "WORK-PLAN.md's own *Closes when* sentences, and each solver's STEP0.md status line"
  written: 2026-09-07
  purpose: >
    Stage I1's third bullet asks that every "closes when" tolerance be
    re-checked after Stage G's geometry. This is that list, machine
    readable, so the re-check is a test rather than a reading. `achieved`
    is the number the solver produces now, not the number quoted when the
    unit was written -- if a later stage moved something, the test fails.
  state_values:
    met: the closure sentence is satisfied
    half: one half of a two-part closure is satisfied and the other is gated
    gated: cannot be evaluated, and `gate` says on what
  sign_convention: >
    `achieved` and `band` are magnitudes of error, so a closure is met when
    achieved <= band. Where the plan's band is not a number -- "inside the
    digitising uncertainty" -- `band` is null and a `note` says why, and
    the test requires that note rather than inventing a figure.

closures:

  - stage: B1
    what: the mixer reproduces Table XXIII's sfc improvement
    band: null
    achieved: 0.7
    units: points on the level
    state: half
    gate: "open on the LEVEL. Table XXIII's column-to-column differences reproduce to 0.25 point, but the level is 0.7 point high because mass-weighted total pressure is the ideal upper bound. Needs Fig 39/40's mixing-plane area, which is Stage H."
    note: "3.6 % at 85 % effectiveness against a separate-flow engine without the mixer's own 0.57 % loss"

  - stage: B3
    what: sfc at three ratings against Table XII
    band: 1.5
    achieved: 1.91
    units: percent
    state: half
    gate: "two of three inside the band. Takeoff reads +1.91 % and is a strict xfail with its size pinned; the cause is recorded -- Table XII is a mixed-day table, T41 on the flat-rating day and sfc on the standard day."
    note: "max climb +0.46 %, max cruise +0.56 %"

  - stage: B4
    what: annulus by continuity at every dimensioned HPT station
    band: null
    achieved: 3.6
    units: percent
    state: met
    note: >
      The plan's band is "inside the digitising uncertainty", which is not
      a number. The status line records it closed: HPT stage-1 and stage-2
      exits -3.6 % and +0.2 % against Fig 3 at Table III's exit Mach
      numbers, with the cycle-match tables closing by two routes each.

  - stage: C1
    what: LPT mean-line efficiency against 0.917
    band: 2.0
    achieved: 0.6
    units: points
    state: met
    note: >
      The band is the loss methods' own stated accuracy, +-2 points. This
      unit CORRECTED the work plan, which had asked for 0.5 point: a
      mean-line method that claims +-2 points for itself cannot be held to
      0.5, and closing to 0.5 point is recorded as a C4 (CFD) claim.

  - stage: C1
    what: HPT mean-line efficiency against 0.9155 / 0.925 / 0.927
    band: 2.0
    achieved: 0.55
    units: points
    state: met

  - stage: C1
    what: HPC efficiency against 0.847
    band: 2.0
    achieved: 0.15
    units: points
    state: met

  - stage: C2
    what: stator-10 exit swirl
    band: 2.0
    achieved: 0.02
    units: degrees
    state: met

  - stage: C4-1
    what: the solver against an exact answer (Sod shock tube, star pressure)
    band: 2.0
    achieved: 0.02
    units: percent
    state: met
    note: "OpenFOAM v2406 against the closed-form Riemann solution; the exact solver itself returns Sod's textbook p*/p_L = 0.30313"

  - stage: C4-2
    what: Rotor 37 blade geometry, 24 section-closure constraints
    band: 0.0
    achieved: 0.0
    units: inches of closure error
    state: met
    note: "and the transcribed tip radius reproduces Table I's tip speed to -0.00 %"

  - stage: C4-3
    what: CFD against the Rotor 37 validation case
    band: null
    achieved: null
    state: gated
    gate: >
      The mesh is built and checked (C4-3) and the case runs, but it
      collapses onto a stalled branch at 26 % of design flow and 13 % of
      design work, repeatably, near iteration 700. Three MRF faults were
      found and fixed and the rotor now compresses (T_out 416.6 K at
      iteration 236) but does not hold. Characterised in
      solvers/cfd/STEP0.md unit C4-4, findings 140-142, with the four
      things to try next in order. Not a gate on anything external -- this
      is a bug to find.

  - stage: D3
    what: total secondary air against Table XI's 16.1 % of W25
    band: 0.5
    achieved: 0.04
    units: percent of W25
    state: half
    gate: "the closure also asks that every cavity keeps hot gas out; the stage-1 nozzle's two are done and no others"

  - stage: D4
    what: cruise clearance, two independent routes
    band: 0.2
    achieved: 0.04
    units: percent of span
    state: met

  - stage: E1
    what: Table X centrifugal stresses, all ten HPC stages
    band: 10.0
    achieved: 6.5
    units: percent
    state: half
    gate: "the closure also asks HPT blade rupture life within a factor of 2; no creep data or Larson-Miller constants are sourced"

  - stage: E2
    what: the bore doubling for a small hole
    band: 0.5
    achieved: 0.0
    units: percent
    state: half
    gate: "the closure also asks HPT disc peak effective stress within 10 % of Fig 64; the disc cross-sections were never digitised"

  - stage: E3
    what: blade first flex, the unshrouded booster
    band: 15.0
    achieved: 2.7
    units: percent
    state: met
    note: "the case the beam should get right, and does"

  - stage: E3
    what: first three modes of every HPC stage against Figs 33-42
    band: 5.0
    achieved: 21.4
    units: percent, mean over 24 comparisons
    state: half
    gate: >
      Figs 33-42 were transcribed on 2026-09-08 and the closure is now
      EVALUATED rather than gated -- and it fails: 1 of 24 comparisons
      inside the band, mean +21.4 %, first flex +15.8 % and over-predicted
      on nine stages of ten. The cause is the one finding 84 already named:
      a clamped beam is the stiffest root a blade can have and a dovetail
      is not a clamp. Closing this needs a root-flexibility model or an FE
      blade, not a better beam. Findings 143-145.

  - stage: E4
    what: no rotor critical inside the operating band
    band: 0.0
    achieved: 0.0
    units: count inside the band
    state: half
    gate: "the closure also asks the thrust-bearing load against capacity; no bearing load or capacity is printed anywhere, and D's thrust balance is not done"

  - stage: E5
    what: every attachment with a printed allowable has margin
    band: 0.0
    achieved: 0.0
    units: percent by which any attachment exceeds its allowable
    state: half
    gate: "HPC dovetails per sec 3.2.3; hpc-mechanical.yaml has no blade or dovetail block at all"

  - stage: F1
    what: every Stage E stress with a printed allowable, tabulated against it
    band: 0.0
    achieved: 0.0
    units: percent by which any stress exceeds its allowable
    state: half
    gate: "allowables AT temperature; MIL-HDBK-5J prints elevated-temperature strength as figures, not tables"

  - stage: F2
    what: basic engine mass within 10 % of 3,473 kg
    band: 10.0
    achieved: null
    units: percent
    state: gated
    gate: "disc profiles un-digitised, casings and frames figure-status, and the 320 kg of sumps and drives has no printed geometry"

  - stage: G1
    what: generated blade volume against Stage F2's integral
    band: 2.0
    achieved: 0.94
    units: percent
    state: half
    gate: "the closure also asks the generated engine mass to match F2, whose own total is gated"

  - stage: G1
    what: blade-to-blade interference, all 32 rows
    band: 0.0
    achieved: 0.0
    units: cubic metres of overlap
    state: met

  - stage: H
    what: zero clashes through rotation, every bearing with its load
    band: null
    achieved: null
    state: gated
    gate: "no hand-CAD tool installed and verified; the plan records Fusion's install as corrupt"

  - stage: I3
    what: FINDINGS.md written -- every disagreement ranked, with a cause or unresolved
    band: 0.0
    achieved: 0.0
    units: sections of the closure not written
    state: met
    note: >
      98 disagreements harvested from the solvers and ranked, median 6.7 %,
      5 recorded unresolved; the FPS-versus-ICLS section written; 142
      findings indexed. Generated by tools/build_findings.py and tested
      against staleness. The work plan calls this the deliverable.

  - stage: I2
    what: one-at-a-time sensitivity of sfc, metal temperature and disc stress
    band: 0.02
    achieved: 0.017
    units: worst departure from an exact analytic elasticity
    state: met
    note: >
      Six elasticities have closed-form values -- combustor efficiency -1,
      density +1, speed +2, radius +2, the two metal temperatures summing
      to 1, and the two heat-transfer coefficients equal and opposite. The
      machine returns all six, worst departure 0.017 on the combustor.

  - stage: J1
    what: the meridional plot draws every module at true scale, with the known join measured and both unknown joins visible as gaps
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      The band for a drawing is a list, not a percentage -- STEP0 unit J1's
      six rows, each one a test in tests/test_meridional.py. All six hold:
      the fan tip at 105.4 cm is inside the axes, the aspect is equal, the
      fan draws radii and no invented wall, the transition duct is at its
      measured 6.85 cm, every radius traces to a table or a dimensioned
      drawing, and the two unpublished offsets are drawn at the values
      engine-flowpath.yaml records as ASSUMED, each labelled with the range
      it is allowed. A cross-artefact test requires the figure and
      app/turbofan/atlas/flowpath.js to place the engine identically
      (finding 159).

  - stage: J2
    what: the Campbell match renders every one of E3's 24 comparisons with its reading uncertainty, on a linear axis, published lines as read
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      J2's closure is about the FIGURE, not the model. E3's closure is a
      separate, recorded miss (1 of 24) and J2 does not move it. What J2
      adds is that the miss is measuring two things at once: on 11 of the
      24 comparisons -- every first-flex mode among them -- the
      transcription cannot resolve a 5 percent band at all, so the
      comparison is unfalsifiable there (finding 160). Among the 13 that
      can be judged, 1 passes. The over-prediction grows with mode number
      on the four stages publishing all three: +19.5, +25.8, +37.8 percent.
      And the published lines being drawn flat costs 3 of the 4 resonance
      crossings in the operating range (finding 162, unresolved).

  - stage: J3
    what: the glTF carries all 32 rows and 2890 blades, each row's mesh within 1 percent of its solid by volume, placed on J1's axis
    band: 1.0
    achieved: 0.374
    units: percent of row volume
    state: met
    gate: null
    note: >
      32 of 32 rows inside the 1 percent band, worst 0.374, median 0.094.
      All 20 HPC rows sit inside the published annulus to 0.8 mm, which is
      G1's solids and J1's walls agreeing for the first time. 4.7 MB for
      2275 drawn blades, because 32 meshes are instanced by 2307 nodes --
      cadquery's own assembly exporter writes a mesh per solid and needs
      27.6 MB for one row. Two limits recorded rather than hidden: the tip
      caps stand up to 3 mm proud of their sections (finding 163) and no
      running clearance is applied (finding 164). The rotating cutaway on
      the site is NOT in this unit; app/turbofan already renders the E3
      procedurally.

  - stage: J4
