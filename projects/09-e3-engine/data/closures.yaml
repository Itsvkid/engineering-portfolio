  - stage: J1
    what: the meridional plot draws every module at true scale, with the known join measured and both unknown joins visible as gaps
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      The band for a drawing is a list, not a percentage -- STEP0 unit J1's
