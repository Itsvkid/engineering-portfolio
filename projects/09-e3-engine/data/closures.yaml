  - stage: J2
    what: the Campbell match renders every one of E3's 24 comparisons with its reading uncertainty, on a linear axis, published lines as read
    band: null
    achieved: null
    units: null
    state: met
    gate: null
    note: >
      J2's closure is about the FIGURE, not the model. E3's closure is a
      separate, recorded miss (1 of 24) and J2 does not move it. What J2
      adds is that the miss is measuring two things at once: on 11 of the
