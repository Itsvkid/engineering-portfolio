meta:
  src: "WORK-PLAN.md's own *Closes when* sentences, and each solver's STEP0.md status line"
  written: 2026-09-07
  purpose: >
    Stage I1's third bullet asks that every "closes when" tolerance be
    re-checked after Stage G's geometry. This is that list, machine
    readable, so the re-check is a test rather than a reading. `achieved`
    is the number the solver produces now, not the number quoted when the
    unit was written -- if a later stage moved something, the test fails.
  state_values:
    met: the closure sentence is satisfied
    half: one half of a two-part closure is satisfied and the other is gated
    gated: cannot be evaluated, and `gate` says on what
  sign_convention: >
    `achieved` and `band` are magnitudes of error, so a closure is met when
    achieved <= band. Where the plan's band is not a number -- "inside the
    digitising uncertainty" -- `band` is null and a `note` says why, and
    the test requires that note rather than inventing a figure.

closures:

  - stage: B1
    what: the mixer reproduces Table XXIII's sfc improvement
    band: 0.5
    achieved: 0.24
    units: points on the level
    state: met
    gate: null
    note: >
      CLOSED 2026-09-18 by unit B5, and it needed no figure. The level was
      0.7 point high because the model formed the mixed total pressure as
      the mass-weighted mean, which has no mixing loss in it at all. A
      constant-area momentum balance at a common static pressure gives
      2.66 percent against Table XXIII's 2.9, and the six bands stated
      before the run all hold: the slopes survive (-0.31 and +0.23 against
      a printed -0.5 and +0.3) and the mixing-plane Mach numbers come out
      0.394 core and 0.515 bypass.

      The gate had said this needed Fig 39/40's mixing-plane AREA and was
      therefore Stage H. It needs only the area RATIO -- every equation in
      a mixing plane is per unit area, proved by scaling both flows by ten
      and finding the intensive state moves by exactly zero (finding 241).
      The ratio, 0.3083, is the LPT rotor-5 exit annulus over the bypass
      annulus the published fan-duct Mach requires, and the closure holds
      across the whole band that Mach allows.

      Two things recorded rather than smoothed: the pre-run hand estimate
      of the mixing loss was 2.7x low because a mixing plane is not the
      duct upstream of it (finding 242), and the area ratio has a choking
      FLOOR at 0.249 below which no solution exists, so the +-30 percent
      sensitivity sweep step 0 asked for cannot be run symmetrically
      (finding 243). The mass-weighted model is retained and still misses;
      that comparison is the finding.

  - stage: B3
    what: >
      sfc at two of the three Table XII ratings inside 1.5 %, with the
      third pinned and its cause tested
    band: 1.5
    achieved: 1.91
    units: percent
    state: half
    gate: >
      RESTATED 2026-09-19 to two-of-three-with-the-third-explained, rather
      than building fan and turbine maps that are partly unsourceable.
      Max climb +0.46 % and max cruise +0.56 % are inside; takeoff reads
      +1.91 % and stays a strict xfail with its SIZE pinned between 1.5
      and 2.5 %.

      What is new is that the CAUSE is now a test and not a sentence.
      CR-168219 sec 4.4 p.33 flat-rates takeoff at ISA+15 and climb and
      cruise at ISA+10, and Table XII quotes T41 on the flat-rating day
      and sfc on the standard day. If that is the cause, the three misses
      must sort by rating DAY and not by power setting -- and they do: the
      two ratings sharing +10 C agree with each other to 0.1 point while
      the +15 C one is 1.35 points away, thirteen times further, and
      cruise is the lowest power of the three and not the closest, so "it
      gets worse with power" does not describe them. Nothing was fitted to
      make that hold; a monotone-with-power ordering would have pointed at
      the model instead. Finding 275,
      tests/test_e3cycle.py::test_the_misses_cluster_by_RATING_DAY_and_not_by_power.

      What would move it to three of three: a constant-thrust solve on the
      standard day, which needs fan and turbine maps. The E3 reports print
      neither a fan map nor a turbine map, so those maps would be
      generated rather than sourced, and a third rating closed on a
      generated map is not a closure.
    note: "max climb +0.46 %, max cruise +0.56 %, takeoff +1.91 % pinned"

