    state: met
    gate: null
    note: >
      32 of 32 rows inside the 1 percent band, worst 0.374, median 0.094.
      All 20 HPC rows sit inside the published annulus to 0.8 mm, which is
      G1's solids and J1's walls agreeing for the first time. 3.96 MB for
      2275 drawn blades, because 32 meshes are instanced by 2307 nodes --
      cadquery's own assembly exporter writes a mesh per solid and needs
      27.6 MB for one row. Two limits recorded rather than hidden: the tip
      caps stand up to 3 mm proud of their sections (finding 163) and no
      running clearance is applied (finding 164). The rotating cutaway on
      the site is NOT in this unit; app/turbofan already renders the E3
