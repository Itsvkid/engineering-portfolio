name: E3 engine CI

# The workflow watches itself as well as the project. Without that line a
# change to this file cannot trigger the job it defines, so a broken CI
# cannot be verified by fixing it — which is exactly what happened when
# scipy was added below and nothing re-ran. workflow_dispatch is here for
# the same reason: a way to prove the runner is green without inventing a
# change to the project.
on:
  push:
    branches: [main]
    paths:
      - "projects/09-e3-engine/**"
      - ".github/workflows/e3-engine-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/09-e3-engine/**"
      - ".github/workflows/e3-engine-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/09-e3-engine
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The whole suite runs here, not a hand-picked subset. Three places
      # need the geometry kernel and each declares that itself, so none has
      # to be named in a list here: tests/test_geometry.py (Stage G1's
      # lofted rows) and tests/test_render.py (Stage J3's glTF) call
      # pytest.importorskip("cadquery") for the whole file, and
      # tests/test_rotor37_geometry.py marks the four of its twenty-two
      # tests that build a solid, because the other eighteen read the
      # transcribed sections and must still run. Naming the pyOCC-free
      # files in a list here, the way projects 06 and 07 do, means the list
      # goes stale the first time a test file is added; letting the files
      # declare their own dependency does not. The comment above said "two
      # files" and was wrong, which is how the first green run was missed.

      # scipy is not optional: solvers/mechanical/beam.py imports
      # scipy.linalg.eigh to solve the beam eigenproblem, and it is not
      # guarded, so leaving it out failed collection on three files
      # (test_blade_frequency, test_campbell, test_findings) rather than
      # failing one assertion. PIL is deliberately absent — the only thing
      # that imports it is tools/read_hpt_fig5.py, a one-off digitiser that
      # no test or build step calls.
      - run: pip install pytest numpy scipy pyyaml matplotlib
      - run: python -m pytest -q

      # The deliverables regenerate from the solvers, and a stale one is
      # worse than none. tests/test_findings.py already fails if
      # FINDINGS.md drifts; this proves the whole build still runs.
      - run: python build.py --list
